<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>

        .btn-header.danger { background: #c62828; color: #fff; border: none; }

        .btn-header.success { background: #2e7d32; color: #fff; border: none; }
        .btn-header.success:hover { background: #1b5e20; }
        .glass-card { background: rgba(255,255,255,0.78); backdrop-filter: blur(12px); border-radius: 28px; border: 1px solid rgba(255,255,255,0.7); padding: 1.5rem 1.8rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,20,40,0.04); }

        .table-modern { margin: 0; font-size: 0.78rem; min-width: 700px; width: 100%; border-collapse: separate; border-spacing: 0; }
        .table-modern thead th { background: #e9f0f8; color: #1a3a5a; font-weight: 700; font-size: 0.6rem; text-transform: uppercase; padding: 10px 8px; border-bottom: 2px solid #d2e0ed; position: sticky; top: 0; z-index: 5; }
        .table-modern tbody td { padding: 8px 8px; border-bottom: 1px solid #e9eef5; vertical-align: middle; }
        .table-modern tbody tr:hover { background: rgba(26,107,176,0.04); }
        .badge-estado { display: inline-block; padding: 3px 12px; border-radius: 40px; font-weight: 700; font-size: 0.6rem; }
        .badge-sec { background: #fff3e0; color: #e67e22; }
        .badge-proc { background: #e3f2fd; color: #1565c0; }

        .btn-modern-sm { padding: 5px 14px; font-size: 0.7rem; border-radius: 60px; border: none; font-weight: 600; transition: 0.2s; }
        .btn-modern-primary { background: linear-gradient(135deg, #0b4b7a, #1a6bb0); color: #fff; }
        .btn-modern-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,107,176,0.3); color: #fff; }
        .btn-modern-success { background: linear-gradient(135deg, #1e7e34, #2e9b4a); color: #fff; }
        .btn-modern-success:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(46,155,74,0.3); color: #fff; }
        .btn-modern-outline { background: transparent; border: 1px solid #dce5ec; color: #2c5a7a; }
        .btn-modern-outline:hover { background: #f1f6fd; }
        .btn-modern-danger { background: #c62828; color: #fff; }
        .btn-modern-danger:hover { background: #b71c1c; color: #fff; }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 400px; width: 100%; pointer-events: none; }
        .toast-custom { background: rgba(30,43,59,0.92); backdrop-filter: blur(16px); color: #fff; padding: 14px 22px; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); font-size: 0.9rem; display: flex; align-items: center; gap: 14px; animation: slideUp 0.4s; pointer-events: auto; border-left: 5px solid transparent; }
        .toast-custom.success { border-left-color: #4caf50; }
        .toast-custom.warning { border-left-color: #ff9800; }
        .toast-custom.danger { border-left-color: #f44336; }
        .toast-custom.info { border-left-color: #2196f3; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .toast-custom.removing { animation: fadeOut 0.3s forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(20px); } }
        .modal-modern .modal-content { border-radius: 32px; border: none; box-shadow: 0 40px 80px rgba(0,0,0,0.2); background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); }
        .modal-modern .modal-header { background: linear-gradient(135deg, #0a2a44, #0b4b7a); color: #fff; border: none; border-radius: 32px 32px 0 0; padding: 1.2rem 2rem; }
        .modal-modern .modal-header .btn-close { filter: brightness(0) invert(1); }
        .modal-modern .modal-body { padding: 2rem; max-height: 70vh; overflow-y: auto; }
        .modal-modern .modal-footer { border-top: 1px solid #e9eef5; padding: 1rem 2rem; background: rgba(255,255,255,0.4); }
        .tab-panel { display: none; animation: fadeUp 0.3s; }
        .tab-panel.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .nav-tabs-custom { display: flex; flex-wrap: wrap; gap: 6px; background: #fff; padding: 6px 12px; border-radius: 60px; border: 1px solid #e2edf7; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .nav-tabs-custom .tab-btn { padding: 8px 20px; border-radius: 40px; border: none; background: transparent; font-weight: 600; font-size: 0.82rem; color: #5f7f9f; transition: 0.2s; cursor: pointer; }
        .nav-tabs-custom .tab-btn:hover { background: #eef5ff; color: #1976d2; }
        .nav-tabs-custom .tab-btn.active { background: #1976d2; color: #fff; box-shadow: 0 4px 12px rgba(25,118,210,0.25); }
        .empty-state { padding: 3rem 1rem; text-align: center; color: #8aa3bc; }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 0.8rem; opacity: 0.5; }
        .text-muted-light { color: #8aa3bc; }
        .fw-600 { font-weight: 600; }
        .gap-2 { gap: 0.5rem; }
        .row-ausente { background-color: #fce4ec !important; }
        .row-presente { background-color: #e8f5e9 !important; }
        .btn-toggle-firestore { background: #6c757d; color: #fff; border: none; border-radius: 60px; padding: 6px 18px; font-weight: 600; font-size: 0.75rem; transition: 0.2s; }
        .btn-toggle-firestore.active { background: #0d6efd; }
        .btn-toggle-firestore:hover { transform: scale(1.02); }
        @media (max-width: 768px) { .app-header { flex-direction: column; align-items: stretch; } .header-actions { justify-content: stretch; } .search-box { max-width: 100%; } }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
            <h2>Acceso al Sistema</h2>
            <p class="text-muted" style="font-size:0.9rem; margin-bottom:1.5rem;">Seleccione su rol y autentíquese</p>

            <div class="mb-3">
                <select id="loginRol" class="form-select">
                    <option value="">Elegir rol…</option>
                    <option value="defensor">⚖️ Defensor</option>
                    <option value="secretario">📋 Secretario</option>
                    <option value="empleado">👤 Empleado</option>
                    <option value="operador">🖥️ Operador</option>
                </select>
            </div>
            <div id="loginEmpleadoContainer" style="display:none;">
                <select id="loginEmpleado" class="form-select">
                    <option value="">Seleccionar empleado…</option>
                </select>
            </div>
            <div id="loginOperadorContainer" style="display:none;">
                <select id="loginOperador" class="form-select">
                    <option value="">Seleccionar operador…</option>
                </select>
            </div>
            <input type="password" id="loginPassword" class="form-control" placeholder="Contraseña" autocomplete="off" />
            <div id="loginError" class="login-error">❌ Credenciales incorrectas.</div>
            <button class="btn-ingresar" id="btnLogin"><i class="bi bi-box-arrow-in-right me-2"></i>Ingresar</button>
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div id="appWrapper" class="app-wrapper">

        <!-- HEADER -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon"><i class="bi bi-balance-scale"></i></div>
                <div>
                    <h1>Sistema Digital de Pases <small>Defensoría Oficial Civil y Comercial 6</small></h1>
                </div>
            </div>
            <div class="header-actions">
                <span class="badge-role" id="lblRol"><i class="bi bi-person-badge"></i> <span id="lblRolNombre">Defensor</span></span>
                <span class="badge-role" id="lblUsuario"><i class="bi bi-person"></i> <span id="lblUsuarioNombre"></span></span>
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" id="globalSearch" placeholder="Buscar expediente…" autocomplete="off" />
                </div>
                <button class="btn-toggle-firestore" id="btnToggleFirestore"><i class="bi bi-cloud"></i> Conectar Firestore</button>
                <button class="btn-header primary" id="btnExportarJSON"><i class="bi bi-download"></i> Exportar JSON</button>
                <button class="btn-header" id="btnImportarJSON"><i class="bi bi-upload"></i> Importar JSON</button>
                <button class="btn-header danger" id="btnCerrarSesion"><i class="bi bi-power me-1"></i>Salir</button>
            </div>
        </header>

        <!-- TABS (se generan dinámicamente) -->
        <div class="nav-tabs-custom" id="tabContainer"></div>

        <!-- PANELES -->
        <div id="panelDefensor" class="tab-panel"></div>
        <div id="panelEmpleado" class="tab-panel"></div>
        <div id="panelOperador" class="tab-panel"></div>
        <div id="panelSecretario" class="tab-panel"></div>

        <footer class="text-center text-muted-light mt-4" style="font-size:0.65rem; border-top:1px solid #e2edf7; padding-top:1rem;">
            <i class="bi bi-database"></i> Modo: <span id="lblModoDatos">Local</span> · Datos en <span id="lblPersistencia">localStorage</span>
        </footer>
    </div>

    <!-- ===== MODALES ===== -->
    <div class="modal fade modal-modern" id="modalHistorial" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-clock-history me-2"></i>Historial · <span id="modalHistorialExp"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalHistorialBody">Cargando…</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade modal-modern" id="modalReporte" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-printer me-2"></i>Reporte</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalReporteBody">Cargando…</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button class="btn btn-modern-primary btn-modern-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Input oculto para importar JSON -->
    <input type="file" id="fileInputJSON" accept=".json" style="display:none;" />

    <!-- TOASTS -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  CONFIGURACIÓN GLOBAL
            // ================================================================
            const CONFIG = {
                passwordDefensor: 'ramos6',
                passwordSecretario: 'def6',
                empleados: [
                    { id: 'emp1', nombre: 'Bazante Nadia Romina', clave: '101' },
                    { id: 'emp2', nombre: 'Bolillat Cesar Enrique', clave: '111' },
                    { id: 'emp3', nombre: 'Cardozo Maria Raquel', clave: '222' },
                    { id: 'emp4', nombre: 'Cedron Noelia', clave: '444' },
                    { id: 'emp5', nombre: 'Escobar Monica Graciela', clave: '114' },
                    { id: 'emp6', nombre: 'Fioravante Rómulo', clave: '505' },
                    { id: 'emp7', nombre: 'Gonzalez Alberto Misael', clave: '606' },
                    { id: 'emp8', nombre: 'Gonzalez Juan Jose', clave: '707' },
                    { id: 'emp9', nombre: 'Gudiño Natalia Esther', clave: '808' },
                    { id: 'emp10', nombre: 'Ortega Lucia Noemi', clave: '909' },
                    { id: 'emp11', nombre: 'Pablos Patricia Tamara', clave: '333' },
                    { id: 'emp12', nombre: 'Palacios Ana Gabriela', clave: '112' },
                    { id: 'emp13', nombre: 'Sosa Rita Cecilia', clave: '113' }
                ],
                secretarios: [
                    { id: 'sec1', nombre: 'Corrales A.Mariela' },
                    { id: 'sec2', nombre: 'Riveros Patricia' },
                    { id: 'sec3', nombre: 'Magnani Enzo' }
                ],
                operadoresClaves: {
                    'Boillat Enrique': '111',
                    'Cardozo Raquel': '222',
                    'Cedron Noelia': '444',
                    'Pablos Patricia': '333',
                    'Gonzalez Misael': '606'
                },
                nivelesPuntos: { 1: 1, 2: 2, 3: 3, 4: 5 },
                nivelesDias: { 1: 5, 2: 3, 3: 3, 4: 2 },
                tipos: [
                    'Nuevo patrocinio', 'Nuevo patrocinio Violencia Familiar', 'Amparo',
                    'Acción de protección de persona', 'Alimentos', 'CEJUME Formulario',
                    'Cuidado personal', 'Declaración de incapacidad', 'Desalojo',
                    'Determinación de capacidad', 'Divorcio', 'Evaluación Art 42 C.C.C.N.',
                    'Filiación', 'Filiación y Daño', 'Laboral', 'Medida autosatisfactiva',
                    'Medida de protección integral', 'Penal (cámara gesell)',
                    'Prescripción Adquisitiva', 'Régimen de comunicación y contacto',
                    'Restitución de menores', 'Restricción de capacidad', 'Violencia Familiar',
                    'Otro'
                ],
                modosIntervencion: [
                    'Defensor Oficial', 'Ministerio Principal', 'Ministerio Complementario',
                    'Patrocinante Actor', 'Patrocinante Demandado', 'Patrocinante Tercero',
                    'Defensor de Ausente', 'Patrocinante presunto incapaz',
                    'Asistencia Letrada del incapaz', 'Ministerio Público del incapaz',
                    'Ministerio Público en turno Abril', 'Ministerio Público en turno Agosto',
                    'Ministerio Público en turno Diciembre', 'Tutor Ad Litem',
                    'Defensor Oficial Art 329 CPCC', 'Defensor Oficial Art 626 CPCC'
                ],
                operadores: ['Boillat Enrique', 'Cardozo Raquel', 'Cedron Noelia', 'Pablos Patricia', 'Gonzalez Misael']
            };

            // ================================================================
            //  ESTADO GLOBAL
            // ================================================================
            let state = {
                causas: [],
                empleados: [], // { id, ausente, fechaReintegro }
                ausencias: [] // para operador (secretarios ausentes)
            };
            let currentRol = '';
            let currentUser = '';
            let currentEmpId = ''; // si es empleado
            let searchTerm = '';
            let useFirestore = false;
            let db = null;
            let firestoreInitialized = false;
            let unsubscribeListeners = [];

            // Paginación (por rol y vista)
            let pagination = {
                defensor: { page: 1, perPage: 10 },
                empleado: { page: 1, perPage: 5 },
                operador: { page: 1, perPage: 10 },
                secretario: { page: 1, perPage: 10 }
            };

            // ================================================================
            //  UTILIDADES
            // ================================================================
            function generateId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 6); }

            function getEmpName(id) {
                const e = CONFIG.empleados.find(x => x.id === id);
                return e ? e.nombre : '-';
            }

            function getSecName(id) {
                const s = CONFIG.secretarios.find(x => x.id === id);
                return s ? s.nombre : '-';
            }

            function fmtDt(iso) {
                if (!iso) return '-';
                const d = new Date(iso);
                return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }

            function getEstadoBadge(estado) {
                const map = {
                    'en_secretaria': '<span class="badge-estado badge-sec">📋 Secretaría</span>',
                    'en_proceso': '<span class="badge-estado badge-proc">🔄 En proceso</span>',
                    'finalizada': '<span class="badge-estado badge-fin">✅ Finalizada</span>',
                    'en_defensor': '<span class="badge-estado badge-def">⚖️ Defensor</span>',
                    'devuelto_siged': '<span class="badge-estado badge-dev">↩️ Devuelto SIGED</span>',
                    'remitido': '<span class="badge-estado badge-rem">📤 Remitido</span>',
                    'rechazado': '<span class="badge-estado badge-rech">🚫 Rechazado</span>'
                };
                return map[estado] || `<span class="badge-estado">${estado}</span>`;
            }

            function getEstadoTexto(estado) {

            function getTiempoTranscurrido(fechaAsignacion, fechaCierre) {
                if (!fechaAsignacion) return null;
                const inicio = new Date(fechaAsignacion);
                const fin = fechaCierre ? new Date(fechaCierre) : new Date();
                const diffMs = fin - inicio;
                if (diffMs < 0) return null;
                const seg = Math.floor(diffMs / 1000);
                const dias = Math.floor(seg / 86400);
                const horas = Math.floor((seg % 86400) / 3600);
                const mins = Math.floor((seg % 3600) / 60);
                const secs = Math.floor(seg % 60);
                if (dias > 0) return `${dias}d ${String(horas).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                return `${String(horas).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function showToast(msg, type = 'success') {

                const icons = { success: 'bi-check-circle-fill', warning: 'bi-exclamation-triangle-fill',

                const div = document.createElement('div');
                div.className = `toast-custom ${type}`;
                div.innerHTML = `<i class="bi ${icons[type] || 'bi-info-circle-fill'}"></i> ${msg}`;
                container.appendChild(div);
                setTimeout(() => { div.classList.add('removing');
                    setTimeout(() => div.remove(), 300); }, 3800);
            }

            function paginateData(data, page, perPage = 10) {
                const total = data.length;
                const totalPages = Math.ceil(total / perPage) || 1;
                const start = (page - 1) * perPage;
                const end = Math.min(start + perPage, total);
                return { items: data.slice(start, end), total, totalPages, page, start, end };
            }

            function renderPagination(targetId, total, totalPages, page, perPage, callback) {
                const container = document.getElementById(targetId);
                if (!container) return;
                let html = `<div class="pagination-bar">
                    <div class="info">Mostrando ${Math.min((page-1)*perPage + 1, total)} - ${Math.min(page*perPage, total)} de ${total}</div>
                    <div>
                        <button class="page-btn" data-page="prev" ${page<=1?'disabled':''}>Anterior</button>
                        ${Array.from({length: Math.min(totalPages, 10)}, (_, i) => {
                            let p = i + 1;
                            if (totalPages > 10) {
                                if (p < page - 4 || p > page + 4) {
                                    if (p === 1 || p === totalPages) return `<button class="page-btn" data-page="${p}">${p}</button>`;
                                    if (p === page - 5 || p === page + 5) return `<span>…</span>`;
                                    return '';
                                }
                            }
                            return `<button class="page-btn ${p===page?'active':''}" data-page="${p}">${p}</button>`;
                        }).join('')}
                        <button class="page-btn" data-page="next" ${page>=totalPages?'disabled':''}>Siguiente</button>
                    </div>
                    <div class="page-selector">
                        <label>Ver:</label>
                        <select class="form-select form-select-sm" style="width:70px;" id="perPageSelect">
                            <option value="5" ${perPage===5?'selected':''}>5</option>
                            <option value="10" ${perPage===10?'selected':''}>10</option>
                            <option value="25" ${perPage===25?'selected':''}>25</option>
                            <option value="50" ${perPage===50?'selected':''}>50</option>
                        </select>
                    </div>
                </div>`;
                container.innerHTML = html;
                container.querySelectorAll('.page-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const p = this.dataset.page;
                        let newPage = page;
                        if (p === 'prev') newPage = Math.max(1, page - 1);
                        else if (p === 'next') newPage = Math.min(totalPages, page + 1);
                        else newPage = parseInt(p);
                        if (newPage !== page) callback(newPage, perPage);
                    });
                });
                const perPageSelect = document.getElementById('perPageSelect');
                if (perPageSelect) {
                    perPageSelect.addEventListener('change', function(e) { callback(1, parseInt(this.value)); });
                }
            }

            // --- Asignación automática (secretario) ---
            function calcularCargaHistorica(empId) {
                const causasDelEmpleado = state.causas.filter(c =>
                    c.empleadoOriginal === empId || c.empleadoAsignado === empId
                );
                const puntosHistoricos = causasDelEmpleado.reduce((sum, c) => sum + (c.puntos || 0), 0);
                const cantidadHistorica = causasDelEmpleado.length;
                const activos = causasDelEmpleado.filter(c => c.estado === 'en_proceso')
                    .reduce((sum, c) => sum + (c.puntos || 0), 0);
                return { puntosHistoricos, cantidadHistorica, activos };
            }

            function seleccionarEmpleadoPorNivel(nivel, empleadosDisponibles) {
                const ordenados = [...empleadosDisponibles];
                ordenados.sort((a, b) => {
                    const cargaA = calcularCargaHistorica(a.id);
                    const cargaB = calcularCargaHistorica(b.id);
                    if (cargaA.puntosHistoricos !== cargaB.puntosHistoricos)
                        return cargaA.puntosHistoricos - cargaB.puntosHistoricos;
                    if (cargaA.cantidadHistorica !== cargaB.cantidadHistorica)
                        return cargaA.cantidadHistorica - cargaB.cantidadHistorica;
                    if (cargaA.activos !== cargaB.activos)
                        return cargaA.activos - cargaB.activos;
                    return a.nombre.localeCompare(b.nombre);
                });
                return ordenados[0].id;
            }

            async function asignarCausa(id, nivSec, empId, com = '', secId = null, tipo = null, modoIntervencion = null) {
                const c = state.causas.find(x => x.id === id);
                if (!c || c.estado !== 'en_secretaria') { showToast('Causa no disponible', 'warning'); return false; }
                if (isAusente(empId)) {
                    showToast('El empleado está ausente, no se puede asignar', 'warning');
                    return false;
                }

                const existing = state.causas.filter(doc => doc.numero === c.numero && doc.empleadoAsignado);
                let empleadoOriginal = null;
                let tipoAsignacion = 'Nuevo Patrocinio';
                let esReingreso = false;

                if (existing.length > 0) {
                    existing.sort((a, b) => new Date(a.fechaAsignacion) - new Date(b.fechaAsignacion));
                    empleadoOriginal = existing[0].empleadoAsignado;
                    tipoAsignacion = 'Seguimiento';
                    esReingreso = true;
                    empId = empleadoOriginal;
                    showToast(`🔁 Reingreso detectado. Asignando a ${getEmpName(empId)} (seguimiento)`, 'info');
                } else {
                    tipoAsignacion = 'Nuevo Patrocinio';
                    esReingreso = false;
                    empleadoOriginal = empId;
                }

                c.nivelSecretario = parseInt(nivSec);
                c.puntos = CONFIG.nivelesPuntos[c.nivelSecretario] || 2;
                c.empleadoId = empId;
                c.empleadoAsignado = empId;
                c.empleadoOriginal = empleadoOriginal;
                c.tipoAsignacion = tipoAsignacion;
                c.esReingreso = esReingreso;
                c.estado = 'en_proceso';
                c.fechaAsignacion = new Date().toISOString();
                c.fechaLimite = new Date(Date.now() + (CONFIG.nivelesDias[c.nivelSecretario] || 3) * 86400000).toISOString();

                if (tipo !== null && tipo !== undefined) c.tipo = tipo;
                if (modoIntervencion !== null && modoIntervencion !== undefined) c.modoIntervencion = modoIntervencion;

                let userRoleName = getSecName(secId || c.secretarioId) || 'Secretario';
                const tipoExp = c.tipo || 'N/D';
                const accion = `Asignado (Nivel ${c.nivelSecretario}) a ${getEmpName(empId)} - ${tipoExp}`;
                if (!c.historial) c.historial = [];
                c.historial.push({
                    fecha: new Date().toISOString(),
                    accion: accion,
                    usuario: userRoleName,
                    comentario: com || `Asignado a ${getEmpName(empId)}`
                });

                await actualizarCausa(c);
                showToast(`📌 ${c.numero} asignado a ${getEmpName(empId)} (${tipoExp})`);
                return true;
            }

                if ((nuevoEstado === 'finalizada' || nuevoEstado === 'en_defensor') && c.empleadoAsignado) {

            // --- Operador: registrar causa ---
            async function registrarCausa(num, tipo, obs, nivel, op, fuenteSiged, fuenteZimbra, accion, motivo, dependencia,
                dni, modoIntervencion, datosParte, asisteDefensoria, fuenteDeut) {
                if (!num.trim()) { showToast('Ingrese número de expediente', 'warning'); return false; }
                const esGesell = tipo && tipo.toLowerCase().includes('cámara gesell');

                let estado = 'en_secretaria';
                let secretarioId = null;
                let accionHistorial = '';
                let motivoGuardado = motivo || null;
                let dependenciaGuardada = dependencia || null;

                if (accion === 'devolver') {
                    estado = 'devuelto_siged';
                    accionHistorial = 'Devuelto a SIGED (ingreso directo)';
                } else if (accion === 'remitir') {
                    estado = 'remitido';
                    accionHistorial = `Remitido a ${dependenciaGuardada || 'dependencia no especificada'} (ingreso directo)`;
                } else if (accion === 'rechazar') {
                    estado = 'rechazado';
                    accionHistorial = 'Rechazado (ingreso directo)';
                } else {
                    if (esGesell) {
                        estado = 'en_defensor';
                        accionHistorial = 'Ingreso directo a Defensor (Cámara Gesell)';
                    } else {
                        // Asignación automática al secretario menos cargado (simplificado)
                        const disponibles = CONFIG.secretarios.filter(s => {
                            // Verificar ausencias (si existen en state.ausencias)
                            const hoy = new Date().toISOString().slice(0,10);
                            const ausente = state.ausencias.some(a => a.secretarioId === s.id && a.fechaInicio <= hoy && (!
                                a.fechaFin || a.fechaFin >= hoy));
                            return !ausente;
                        });
                        if (disponibles.length > 0) {
                            const conCarga = disponibles.map(s => {
                                const carga = state.causas.filter(c => c.secretarioId === s.id && (c.estado ===
                                    'en_secretaria' || c.estado === 'en_proceso')).length;
                                return { ...s, carga };
                            });
                            conCarga.sort((a, b) => a.carga - b.carga);
                            secretarioId = conCarga[0].id;
                            accionHistorial = `Ingreso a Secretaría (${getSecName(secretarioId)})`;
                        } else {
                            accionHistorial = 'Ingreso sin asignación (todos ausentes)';
                        }
                    }
                }

                const nueva = {
                    id: generateId(),
                    numero: num.trim().toUpperCase(),
                    dni: dni.trim() || '',
                    datosParte: datosParte || '',
                    asisteDefensoria: asisteDefensoria || '',
                    tipo: tipo || 'Otro',
                    nivelOperador: parseInt(nivel) || 2,
                    nivelSecretario: null,
                    puntos: 0,
                    observaciones: obs || '',
                    estado: estado,
                    secretarioId: secretarioId,
                    empleadoId: null,
                    empleadoAsignado: null,
                    empleadoOriginal: null,
                    tipoAsignacion: null,
                    esReingreso: false,
                    fechaPaseSecretario: new Date().toISOString(),
                    fechaAsignacion: null,
                    fechaFinalizacion: null,
                    fechaLimite: null,
                    fechaResolucionEmpleado: null,
                    operador: op || currentUser || 'Desconocido',
                    asistenciaCamaraGesell: false,
                    asistenciaGesell: 'pendiente',
                    fechaHoraGesell: null,
                    fuenteSiged: fuenteSiged || false,
                    fuenteZimbra: fuenteZimbra || false,
                    fuenteDeut: fuenteDeut || false,
                    motivoAccion: motivoGuardado,
                    dependenciaRemision: dependenciaGuardada,
                    modoIntervencion: modoIntervencion || '',
                    historial: [{
                        fecha: new Date().toISOString(),
                        accion: accionHistorial,
                        usuario: op || currentUser || 'Operador',
                        comentario: motivoGuardado || obs || 'Sin observaciones'
                    }]
                };

                await agregarCausa(nueva);
                if (accion === 'devolver') {
                    showToast(`✅ Causa ${nueva.numero} registrada como DEVUELTA a SIGED.`);
                } else if (accion === 'remitir') {
                    showToast(`✅ Causa ${nueva.numero} registrada como REMITIDA a ${dependenciaGuardada || 'dependencia'}.`);
                } else if (accion === 'rechazar') {
                    showToast(`✅ Causa ${nueva.numero} registrada como RECHAZADA.`);
                } else {
                    if (esGesell) {
                        showToast(`✅ Pase registrado (Cámara Gesell) - Derivado a Defensor: ${nueva.numero}`);
                    } else if (secretarioId) {
                        showToast(`✅ Pase registrado: ${nueva.numero} (Secretario: ${getSecName(secretarioId)})`);
                    } else {
                        showToast(`✅ Pase registrado: ${nueva.numero} (sin asignar por ausencias)`);
                    }
                }
                return true;
            }

            // ================================================================
            //  HISTORIAL (modal)
            // ================================================================
            function abrirHistorial(id) {
                const c = state.causas.find(x => x.id === id);
                if (!c) { showToast('Causa no encontrada', 'danger'); return; }
                document.getElementById('modalHistorialExp').textContent = c.numero;
                const body = document.getElementById('modalHistorialBody');
                let html = '';
                if (c.datosParte) html += `<div><strong>Datos Parte:</strong> ${c.datosParte}</div>`;
                if (c.dni) html += `<div><strong>DNI:</strong> ${c.dni}</div>`;
                if (c.asisteDefensoria) html += `<div><strong>Asiste:</strong> ${c.asisteDefensoria}</div>`;
                html += `<hr /><h6>Movimientos</h6>`;
                if (!c.historial || !c.historial.length) {
                    html += '<div class="text-muted">Sin movimientos.</div>';
                } else {
                    html += c.historial.slice().reverse().map(m =>
                        `<div class="d-flex flex-wrap gap-2 align-items-start border-bottom py-2">
                            <span style="font-size:0.75rem;color:#5f7f9f;min-width:140px;">${fmtDt(m.fecha)}</span>
                            <span class="fw-600" style="min-width:100px;">${m.usuario || 'Sistema'}</span>
                            <span style="flex:1;">${m.accion}</span>
                            <span style="font-size:0.8rem;color:#5f7f9f;width:100%;padding-left:140px;">${m.comentario || '-'}</span>
                        </div>`
                    ).join('');
                }
                body.innerHTML = html;
                new bootstrap.Modal(document.getElementById('modalHistorial')).show();
            }

            // ================================================================
            //  RENDER ALL (según rol activo)
            // ================================================================
            function renderAll() {
                // Actualizar pestañas
                renderTabs();
                const activeTab = document.querySelector('.tab-btn.active');
                if (activeTab) {
                    const target = activeTab.dataset.target;
                    switch (target) {
                        case 'panelDefensor':
                            if (currentRol === 'defensor') renderDefensor();
                            break;
                        case 'panelEmpleado':
                            if (currentRol === 'empleado') renderEmpleado();
                            break;
                        case 'panelOperador':
                            if (currentRol === 'operador') renderOperador();
                            break;
                        case 'panelSecretario':
                            if (currentRol === 'secretario') renderSecretario();
                            break;
                    }
                }
                // Actualizar modo de datos
                document.getElementById('lblModoDatos').textContent = useFirestore ? 'Nube (Firestore)' : 'Local';
                document.getElementById('lblPersistencia').textContent = useFirestore ? 'Firestore' : 'localStorage';
                const btn = document.getElementById('btnToggleFirestore');
                btn.classList.toggle('active', useFirestore);
                btn.innerHTML = useFirestore ? '<i class="bi bi-cloud-check"></i> Desconectar Firestore' :
                    '<i class="bi bi-cloud"></i> Conectar Firestore';
            }

            function renderTabs() {
                const container = document.getElementById('tabContainer');
                let tabs = [];
                if (currentRol === 'defensor') tabs.push({ id: 'panelDefensor', label: '⚖️ Defensor' });
                else if (currentRol === 'empleado') tabs.push({ id: 'panelEmpleado', label: '👤 Empleado' });
                else if (currentRol === 'operador') tabs.push({ id: 'panelOperador', label: '🖥️ Operador' });
                else if (currentRol === 'secretario') tabs.push({ id: 'panelSecretario', label: '📋 Secretario' });

                // Si no hay tabs, agregar uno por defecto
                if (!tabs.length) tabs.push({ id: 'panelDefensor', label: '📋 Inicio' });

                const currentActive = container.querySelector('.tab-btn.active');
                let activeId = currentActive ? currentActive.dataset.target : tabs[0].id;

                container.innerHTML = tabs.map(t =>
                    `<button class="tab-btn ${t.id === activeId ? 'active' : ''}" data-target="${t.id}">${t.label}</button>`
                ).join('');

                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.getElementById(activeId)?.classList.add('active');

                container.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                        const target = document.getElementById(this.dataset.target);
                        if (target) target.classList.add('active');
                        renderAll();
                    });
                });
            }

            // ================================================================
            //  LOGIN
            // ================================================================
            function initLogin() {
                const rolSelect = document.getElementById('loginRol');
                const empContainer = document.getElementById('loginEmpleadoContainer');
                const opContainer = document.getElementById('loginOperadorContainer');
                const empSelect = document.getElementById('loginEmpleado');
                const opSelect = document.getElementById('loginOperador');

                rolSelect.addEventListener('change', function() {
                    const val = this.value;
                    empContainer.style.display = (val === 'empleado') ? 'block' : 'none';
                    opContainer.style.display = (val === 'operador') ? 'block' : 'none';
                    if (val === 'empleado') {
                        empSelect.innerHTML = '<option value="">Seleccionar empleado…</option>';
                        CONFIG.empleados.forEach(e => {
                            const opt = document.createElement('option');
                            opt.value = e.id;
                            opt.textContent = e.nombre;
                            empSelect.appendChild(opt);
                        });
                    } else if (val === 'operador') {
                        opSelect.innerHTML = '<option value="">Seleccionar operador…</option>';
                        Object.keys(CONFIG.operadoresClaves).forEach(op => {
                            const opt = document.createElement('option');
                            opt.value = op;
                            opt.textContent = op;
                            opSelect.appendChild(opt);
                        });
                    }
                });

                document.getElementById('btnLogin').addEventListener('click', async function() {
                    const rol = rolSelect.value;
                    const pass = document.getElementById('loginPassword').value;
                    const errorDiv = document.getElementById('loginError');
                    errorDiv.style.display = 'none';

                    if (!rol) { errorDiv.textContent = 'Seleccione un rol.';
                        errorDiv.style.display = 'block'; return; }

                    let ok = false;
                    let user = '';

                    if (rol === 'defensor') {
                        if (pass === CONFIG.passwordDefensor) { ok = true;
                            user = 'Defensor'; }
                    } else if (rol === 'secretario') {
                        if (pass === CONFIG.passwordSecretario) { ok = true;
                            user = 'Secretario'; }
                    } else if (rol === 'empleado') {
                        const empId = empSelect.value;
                        if (!empId) { errorDiv.textContent = 'Seleccione un empleado.';
                            errorDiv.style.display = 'block'; return; }
                        const emp = CONFIG.empleados.find(e => e.id === empId);
                        if (emp && pass === emp.clave) { ok = true;
                            user = emp.nombre;
                            currentEmpId = empId; }
                    } else if (rol === 'operador') {
                        const op = opSelect.value;
                        if (!op) { errorDiv.textContent = 'Seleccione un operador.';
                            errorDiv.style.display = 'block'; return; }
                        if (CONFIG.operadoresClaves[op] && pass === CONFIG.operadoresClaves[op]) { ok = true;
                            user = op; }
                    }

                    if (!ok) {
                        errorDiv.textContent = '❌ Credenciales incorrectas.';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    currentRol = rol;
                    currentUser = user;
                    document.getElementById('loginOverlay').classList.add('hidden');
                    document.getElementById('appWrapper').classList.add('visible');
                    document.getElementById('lblRolNombre').textContent = rol.charAt(0).toUpperCase() + rol.slice(1);
                    document.getElementById('lblUsuarioNombre').textContent = user;

                    // Cargar datos (local o nube según flag)
                    if (useFirestore && firestoreInitialized) {
                        await loadFromFirestore();
                    } else {
                        // Cargar desde localStorage o iniciar vacío
                        if (!loadFromLocalStorage()) {
                            state.causas = [];
                            state.empleados = CONFIG.empleados.map(e => ({ id: e.id, ausente: false,
                            fechaReintegro: null }));
                            state.ausencias = [];
                            saveToLocalStorage();
                        }
                    }
                    renderAll();
                    showToast(`Bienvenido/a ${user}`, 'success');
                });

                document.getElementById('loginPassword').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') document.getElementById('btnLogin').click();
                });
            }

            // ================================================================
            //  EVENTOS GLOBALES (búsqueda, exportar, importar, firestore)
            // ================================================================
            document.getElementById('globalSearch').addEventListener('input', function() {
                searchTerm = this.value.trim();
                // Reset paginación
                Object.keys(pagination).forEach(k => pagination[k].page = 1);
                renderAll();
            });

            document.getElementById('btnExportarJSON').addEventListener('click', function() {
                const data = {
                    causas: state.causas,
                    empleados: state.empleados,
                    ausencias: state.ausencias,
                    meta: {
                        exportado: new Date().toISOString(),
                        version: '1.0'
                    }
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `estado_sistema_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Exportación completada', 'success');
            });

            document.getElementById('btnImportarJSON').addEventListener('click', function() {
                document.getElementById('fileInputJSON').click();
            });

            document.getElementById('fileInputJSON').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.causas && Array.isArray(data.causas)) {
                            state.causas = data.causas;
                            state.empleados = data.empleados || CONFIG.empleados.map(e => ({ id: e.id,
                                ausente: false, fechaReintegro: null }));
                            state.ausencias = data.ausencias || [];
                            saveToLocalStorage();
                            showToast(`Importados ${state.causas.length} registros`, 'success');
                            renderAll();
                        } else {
                            showToast('Formato JSON inválido', 'danger');
                        }
                    } catch (err) {
                        showToast('Error al leer el archivo JSON', 'danger');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
                this.value = '';
            });

            document.getElementById('btnToggleFirestore').addEventListener('click', async function() {
                if (useFirestore) {
                    // Desconectar
                    useFirestore = false;
                    // Cargar desde localStorage
                    loadFromLocalStorage();
                    renderAll();
                    showToast('Modo local activado', 'info');
                } else {
                    // Conectar
                    if (!firestoreInitialized) {
                        if (!initFirestore()) return;
                    }
                    useFirestore = true;
                    await loadFromFirestore();
                    renderAll();
                    showToast('Modo nube (Firestore) activado', 'success');
                }
            });

            document.getElementById('btnCerrarSesion').addEventListener('click', function() {
                if (confirm('¿Cerrar sesión?')) {
                    document.getElementById('appWrapper').classList.remove('visible');
                    document.getElementById('loginOverlay').classList.remove('hidden');
                    currentRol = '';
                    currentUser = '';
                    currentEmpId = '';
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('loginRol').value = '';
                    document.getElementById('loginEmpleadoContainer').style.display = 'none';
                    document.getElementById('loginOperadorContainer').style.display = 'none';
                    if (useFirestore) {
                        useFirestore = false;
                        // Cargar local para la próxima
                        loadFromLocalStorage();
                    }
                    renderAll();
                    showToast('Sesión cerrada', 'warning');
                }
            });

            // ================================================================
            //  INICIO
            // ================================================================
            document.addEventListener('DOMContentLoaded', function() {
                initLogin();
                // Cargar estado local inicial
                loadFromLocalStorage();
                // Si no hay datos, inicializar vacío
                if (!state.causas.length) {
                    state.empleados = CONFIG.empleados.map(e => ({ id: e.id, ausente: false, fechaReintegro: null }));
                    state.ausencias = [];
                    saveToLocalStorage();
                }
            });

        })();
    </script>
</body>
</html>
