                    // Si no hay filtro de empleado, mantener el último seleccionado (o el primero)
                    empId = empleadoSeleccionado || CONFIG.empleados[0]?.id || '';
                }
                // Actualizar la variable global para que coincida con el filtro
                empleadoSeleccionado = empId;

                let empObj = CONFIG.empleados.find(e => e.id === empId);
                let nombreEmpleado = empObj ? empObj.nombre : 'Seleccione un empleado';

                // Función para calcular KPIs de un empleado (sin cambios)
                function calcularKPIs(empId, empObj) {
                    let total = 0,
                        enProceso = 0,
                        enSecretaria = 0,
                        enDefensor = 0,
                        finalizados = 0,
                        conDemora = 0;

                    if (empObj) {
                        const todas = causas.filter(c => {
                            const esSuPase = (
                                (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                                (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj
                                    .nombre)) ||
                                (c.empleadoOriginal && c.empleadoOriginal === empId)
                            );
                            return esSuPase;
                        });

                        total = todas.length;
                        enProceso = todas.filter(c => c.estado === 'en_proceso' && c.empleadoAsignado === empId).length;
                        finalizados = todas.filter(c => c.estado === 'finalizada').length;

                        enSecretaria = todas.filter(c => {
                            if (c.estado !== 'en_secretaria') return false;
                            if (!c.historial) return false;
                            return c.historial.some(h => {
                                const esAccion = h.accion && (h.accion.includes('Devuelto a Secretaría') || h
                                    .accion.includes('Enviado a Secretario para consulta'));
                                const esUsuario = h.usuario && (h.usuario === empObj.nombre || h.usuario ===
                                    empId);
                                return esAccion && esUsuario;
                            });
                        }).length;

                        enDefensor = todas.filter(c => {
                            if (c.estado !== 'en_defensor') return false;
                            const tieneRelacion = (
                                (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                                (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj
                                    .nombre)) ||
                                (c.empleadoOriginal && c.empleadoOriginal === empId)
                            );
                            if (tieneRelacion) return true;
                            if (c.historial) {
                                return c.historial.some(h => h.usuario === empObj.nombre || h.usuario === empId);
                            }
                            return false;
                        }).length;

                        conDemora = todas.filter(c => {
                            if (c.estado !== 'en_proceso') return false;
                            if (c.empleadoAsignado !== empId) return false;
                            if (!c.fechaLimite) return false;
                            return new Date(c.fechaLimite) < new Date();
                        }).length;
                    }

                    return { total, enProceso, enSecretaria, enDefensor, finalizados, conDemora, nombre: empObj ? empObj.nombre : '' };
                }

                // Selector de empleado para el gráfico y KPIs
                let opts = CONFIG.empleados.map(e =>
                    `<option value="${e.id}" ${e.id === empId ? 'selected' : ''}>${e.nombre}</option>`
                ).join('');

                let kpis = calcularKPIs(empId, empObj);
                empleadoNombreActual = kpis.nombre;

                // HTML completo
                container.innerHTML = `
                    <!-- Tabla general con filtros y paginación -->
                    <div class="tabla-empleados-container">
                        <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap">
                            <h5 class="mb-0">Expedientes asignados a empleados</h5>
                            <button class="btn btn-outline-primary btn-sm btn-print-tabla" id="btnImprimirTablaEmpleados">
                                <i class="bi bi-printer"></i> Imprimir tabla
                            </button>
                        </div>

                        <!-- KPIs de total y filtro activo -->
                        <div class="total-filtro-kpi">
                            <div class="total-kpi">
                                <i class="bi bi-files"></i>
                                <span class="cantidad">${total}</span>
                                <span style="font-weight:400; color:#5f7f9f; font-size:0.9rem;">expediente${total !== 1 ? 's' : ''}</span>
                            </div>
                            <div class="filtro-activo">
                                <i class="bi bi-funnel"></i> ${filtroActivoTexto}
                            </div>
                        </div>

                        <div class="filtros-empleados">
                            <div>
                                <label>Empleado</label>
                                <select id="filtroEmpleado">
                                    <option value="todos" ${filtrosEmpleado.empleado === 'todos' ? 'selected' : ''}>Todos</option>
                                    ${CONFIG.empleados.map(e => `<option value="${e.id}" ${filtrosEmpleado.empleado === e.id ? 'selected' : ''}>${e.nombre}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label>Tipo</label>
                                <select id="filtroTipo">
                                    <option value="todos" ${filtrosEmpleado.tipo === 'todos' ? 'selected' : ''}>Todos</option>
                                    ${tiposUnicos.map(t => `<option value="${t}" ${filtrosEmpleado.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label>Secretario</label>
                                <select id="filtroSecretario">
                                    <option value="todos" ${filtrosEmpleado.secretario === 'todos' ? 'selected' : ''}>Todos</option>
                                    ${secretariosUnicos.map(s => `<option value="${s}" ${filtrosEmpleado.secretario === s ? 'selected' : ''}>${s}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label>Estado</label>
                                <select id="filtroEstado">
                                    <option value="todos" ${filtrosEmpleado.estado === 'todos' ? 'selected' : ''}>Todos</option>
                                    ${estadosUnicos.map(e => `<option value="${e}" ${filtrosEmpleado.estado === e ? 'selected' : ''}>${e}</option>`).join('')}
                                </select>
                            </div>
                            <button class="btn-limpiar" id="btnLimpiarFiltrosEmp">Limpiar filtros</button>
                        </div>
                        ${tablaHTML}
                        <div id="paginationEmpleado"></div>
                    </div>

                    <!-- Selector y KPIs para empleado individual -->
                    <div class="empleado-selector">
                        <label for="selectEmpleado">Seleccionar empleado para KPIs:</label>
                        <select id="selectEmpleado" class="form-select" style="width:auto;min-width:200px;">${opts}</select>
                    </div>

                    <div id="empleadoNombreDestacado" class="empleado-nombre-destacado">
                        ${empleadoNombreActual || 'Seleccione un empleado'}
                    </div>

                    <div class="chart-container"><canvas id="chartKPIsEmpleado"></canvas></div>

                    <div id="kpisEmpleadoContainer" class="kpi-grid">
                        <div class="kpi-item" data-kpi="total">
                            <div class="kpi-label">Total</div>
                            <div class="kpi-value">${kpis.total}</div>
                            <button class="btn btn-outline-primary btn-sm ver-historial-btn mt-2" data-kpi="total">Ver Historial</button>
                        </div>
                        <div class="kpi-item" data-kpi="enProceso">
                            <div class="kpi-label">En Proceso</div>
                            <div class="kpi-value text-primary">${kpis.enProceso}</div>
                            <button class="btn btn-outline-primary btn-sm ver-historial-btn mt-2" data-kpi="enProceso">Ver Historial</button>
                        </div>
                        <div class="kpi-item" data-kpi="enSecretaria">
                            <div class="kpi-label">En Secretaría</div>
                            <div class="kpi-value text-warning">${kpis.enSecretaria}</div>
                            <button class="btn btn-outline-primary btn-sm ver-historial-btn mt-2" data-kpi="enSecretaria">Ver Historial</button>
                        </div>
                        <div class="kpi-item" data-kpi="enDefensor">
                            <div class="kpi-label">En Defensor</div>
                            <div class="kpi-value text-info">${kpis.enDefensor}</div>
                            <button class="btn btn-outline-primary btn-sm ver-historial-btn mt-2" data-kpi="enDefensor">Ver Historial</button>
                        </div>
                        <div class="kpi-item" data-kpi="finalizados">
                            <div class="kpi-label">Finalizados</div>
                            <div class="kpi-value text-success">${kpis.finalizados}</div>
                            <button class="btn btn-outline-primary btn-sm ver-historial-btn mt-2" data-kpi="finalizados">Ver Historial</button>
                        </div>
                        <div class="kpi-item" data-kpi="conDemora">
                            <div class="kpi-label">Con Demora</div>
                            <div class="kpi-value text-danger">${kpis.conDemora}</div>
                            <button class="btn btn-outline-primary btn-sm ver-historial-btn mt-2" data-kpi="conDemora">Ver Historial</button>
                        </div>
                    </div>
                `;

                // Renderizar paginación
                if (total > 0) {
                    renderPagination('paginationEmpleado', total, totalPages, page, pState.perPage, (newPage, newPerPage) => {
                        paginacionEmpleado.page = newPage;
                        paginacionEmpleado.perPage = newPerPage;
                        renderEmpleado(container);
                    });
                }

                // Renderizar gráfico de barras con los KPIs
                setTimeout(() => {
                    const ctx = document.getElementById('chartKPIsEmpleado');
                    if (ctx) {
                        if (chartInstances.kpisEmpleado) chartInstances.kpisEmpleado.destroy();
                        chartInstances.kpisEmpleado = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: ['Total', 'En Proceso', 'En Secretaría', 'En Defensor', 'Finalizados', 'Con Demora'],
                                datasets: [{
                                    label: empleadoNombreActual || 'Empleado',
                                    data: [kpis.total, kpis.enProceso, kpis.enSecretaria, kpis.enDefensor, kpis.finalizados, kpis.conDemora],
                                    backgroundColor: ['#0a2a44', '#1976d2', '#e67e22', '#7b1fa2', '#2e7d32', '#c62828'],
                                    borderRadius: 6,
                                    borderColor: '#fff',
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        callbacks: {
                                            label: function(context) {
                                                return context.parsed.y + ' causas';
                                            }
                                        }
                                    }
                                },
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: { stepSize: 1 }
                                    }
                                },
                                onClick: function(event, elements) {
                                    if (elements.length > 0) {
                                        const index = elements[0].index;
                                        const labels = ['total', 'enProceso', 'enSecretaria', 'enDefensor', 'finalizados', 'conDemora'];
                                        const kpiKey = labels[index];
                                        actualizarKPIsDestacado(kpiKey);
                                    }
                                }
                            }
                        });
                    }
                }, 100);

                // --- EVENTOS DE FILTROS ---
                // Filtro empleado: además de actualizar la tabla, sincroniza el selector de KPIs
                document.getElementById('filtroEmpleado').addEventListener('change', function() {
                    const valor = this.value;
                    filtrosEmpleado.empleado = valor;
                    // Sincronizar el selector de KPIs con el filtro de empleado
                    empleadoSeleccionado = valor === 'todos' ? CONFIG.empleados[0]?.id || '' : valor;
                    paginacionEmpleado.page = 1;
                    renderEmpleado(container);
                });

                document.getElementById('filtroTipo').addEventListener('change', function() {
                    filtrosEmpleado.tipo = this.value;
                    paginacionEmpleado.page = 1;
                    renderEmpleado(container);
                });
                document.getElementById('filtroSecretario').addEventListener('change', function() {
                    filtrosEmpleado.secretario = this.value;
                    paginacionEmpleado.page = 1;
                    renderEmpleado(container);
                });
                document.getElementById('filtroEstado').addEventListener('change', function() {
                    filtrosEmpleado.estado = this.value;
                    paginacionEmpleado.page = 1;
                    renderEmpleado(container);
                });
                document.getElementById('btnLimpiarFiltrosEmp').addEventListener('click', function() {
                    filtrosEmpleado = { empleado: 'todos', tipo: 'todos', secretario: 'todos', estado: 'todos' };
                    empleadoSeleccionado = CONFIG.empleados[0]?.id || '';
                    paginacionEmpleado.page = 1;
                    renderEmpleado(container);
                });

                // Evento de cambio de empleado para KPIs (cuando se cambia manualmente)
                document.getElementById('selectEmpleado').addEventListener('change', function() {
                    empleadoSeleccionado = this.value;
                    // También actualizar el filtro de empleado de la tabla para mantener sincronía
                    filtrosEmpleado.empleado = empleadoSeleccionado;
                    // Forzar la actualización del selector de la tabla
                    const filtroEmp = document.getElementById('filtroEmpleado');
                    if (filtroEmp) filtroEmp.value = empleadoSeleccionado;
                    paginacionEmpleado.page = 1;
                    renderEmpleado(container);
                });

                // Asignar eventos a los botones "Ver Historial"
                asignarEventosHistorial(container);

                // Botón imprimir tabla general
                document.getElementById('btnImprimirTablaEmpleados').addEventListener('click', function() {
                    imprimirTablaEmpleados();
                });
            }

            // Función para imprimir la tabla general de empleados (con filtros actuales)
            function imprimirTablaEmpleados() {
                const container = document.querySelector('.tabla-empleados-container');
                if (!container) return;
                const tabla = container.querySelector('table');
                if (!tabla) {
                    showToast('No hay tabla para imprimir', 'warning');
                    return;
                }
                const clon = tabla.cloneNode(true);
                clon.querySelectorAll('a').forEach(a => {
                    const text = a.textContent;
                    const span = document.createElement('span');
                    span.textContent = text;
                    a.parentNode.replaceChild(span, a);
                });
                const html = `
                    <html>
                        <head>
                            <title>Expedientes asignados a empleados</title>
                            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
                            <style>
                                body { padding: 20px; font-family: 'Inter', sans-serif; }
                                .table { width: 100%; border-collapse: collapse; }
                                .table th, .table td { border: 1px solid #dee2e6; padding: 8px; }
                                .table th { background: #f0f4fa; }
                                .demora-si { font-weight: 700; color: #c62828; }
                                .demora-no { font-weight: 700; color: #2e7d32; }
                                .tipo-negrita-azul { font-weight: 700; color: #0d6efd; }
                                h4 { margin-bottom: 20px; }
                            </style>
                        </head>
                        <body>
                            <h4>Expedientes asignados a empleados</h4>
                            ${clon.outerHTML}
                            <p style="margin-top:20px; color:#6c757d; font-size:0.8rem;">Impreso el ${getFechaHoraImpresion()}</p>
                            <script>
                                window.onload = function() { window.print(); window.close(); }
                            <\/script>
                        </body>
                    </html>
                `;
                const printWindow = window.open('', '_blank', 'width=800,height=600');
                if (!printWindow) {
                    showToast('No se pudo abrir la ventana de impresión. Permita ventanas emergentes.', 'warning');
                    return;
                }
                printWindow.document.write(html);
                printWindow.document.close();
            }

            // Función para actualizar KPIs destacando el seleccionado (sin cambios)
            function actualizarKPIsDestacado(kpiKey) {
                const container = document.getElementById('kpisEmpleadoContainer');
                if (!container) return;

                let empId = empleadoSeleccionado;
                let empObj = CONFIG.empleados.find(e => e.id === empId);
                if (!empObj) return;

                const todas = causas.filter(c => {
                    const esSuPase = (
                        (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                        (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj.nombre)) ||
                        (c.empleadoOriginal && c.empleadoOriginal === empId)
                    );
                    return esSuPase;
                });

                const kpis = {
                    total: todas.length,
                    enProceso: todas.filter(c => c.estado === 'en_proceso' && c.empleadoAsignado === empId).length,
                    finalizados: todas.filter(c => c.estado === 'finalizada').length,
                    enSecretaria: todas.filter(c => {
                        if (c.estado !== 'en_secretaria') return false;
                        if (!c.historial) return false;
                        return c.historial.some(h => {
                            const esAccion = h.accion && (h.accion.includes('Devuelto a Secretaría') || h.accion.includes('Enviado a Secretario para consulta'));
                            const esUsuario = h.usuario && (h.usuario === empObj.nombre || h.usuario === empId);
                            return esAccion && esUsuario;
                        });
                    }).length,
                    enDefensor: todas.filter(c => {
                        if (c.estado !== 'en_defensor') return false;
                        const tieneRelacion = (
                            (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                            (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj.nombre)) ||
                            (c.empleadoOriginal && c.empleadoOriginal === empId)
                        );
                        if (tieneRelacion) return true;
                        if (c.historial) {
                            return c.historial.some(h => h.usuario === empObj.nombre || h.usuario === empId);
                        }
                        return false;
                    }).length,
                    conDemora: todas.filter(c => {
                        if (c.estado !== 'en_proceso') return false;
                        if (c.empleadoAsignado !== empId) return false;
                        if (!c.fechaLimite) return false;
                        return new Date(c.fechaLimite) < new Date();
                    }).length
                };

                const items = container.querySelectorAll('.kpi-item');
                items.forEach(item => {
                    const key = item.dataset.kpi;
                    const valueSpan = item.querySelector('.kpi-value');
                    if (key && valueSpan) {
                        const val = kpis[key] !== undefined ? kpis[key] : 0;
                        valueSpan.textContent = val;
                        item.style.border = (key === kpiKey) ? '3px solid #0d6efd' : '1px solid #e2edf7';
                        item.style.background = (key === kpiKey) ? '#e8f4ff' : '#fff';
                    }
                });

                const ctx = document.getElementById('chartKPIsEmpleado');
                if (ctx && chartInstances.kpisEmpleado) {
                    chartInstances.kpisEmpleado.data.datasets[0].data = [kpis.total, kpis.enProceso, kpis.enSecretaria, kpis.enDefensor, kpis.finalizados, kpis.conDemora];
                    chartInstances.kpisEmpleado.update();
                }
                if (chartInstances.kpisEmpleado) {
                    chartInstances.kpisEmpleado.data.datasets[0].label = empObj.nombre;
                    chartInstances.kpisEmpleado.update();
                }
                const nombreDiv = document.getElementById('empleadoNombreDestacado');
                if (nombreDiv) {
                    nombreDiv.textContent = empObj.nombre;
                }
            }

            // ---------- FUNCIONES PARA EL MODAL DE HISTORIAL ----------
            let historialModalInstance = null;

            function crearModalHistorial() {
                if (document.getElementById('historialModal')) return;

                const modalHTML = `
                    <div class="modal fade" id="historialModal" tabindex="-1" aria-labelledby="historialModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="historialModalLabel">Historial de expedientes</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body" id="historialModalBody">
                                    <div id="historialTablaContainer"></div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                    <button type="button" class="btn btn-primary" id="imprimirHistorialBtn">Imprimir tabla</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHTML);

                const modalEl = document.getElementById('historialModal');
                historialModalInstance = new bootstrap.Modal(modalEl);

                document.getElementById('imprimirHistorialBtn').addEventListener('click', function() {
                    imprimirTablaHistorial();
                });
            }

            function asignarEventosHistorial(container) {
                const botones = container.querySelectorAll('.ver-historial-btn');
                botones.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const kpiKey = this.dataset.kpi;
                        const empId = empleadoSeleccionado;
                        verHistorial(kpiKey, empId);
                    });
                });
            }

            function verHistorial(kpiKey, empId) {
                const empObj = CONFIG.empleados.find(e => e.id === empId);
                if (!empObj) {
                    showToast('Empleado no encontrado', 'danger');
                    return;
                }

                const todas = causas.filter(c => {
                    const esSuPase = (
                        (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                        (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj.nombre)) ||
                        (c.empleadoOriginal && c.empleadoOriginal === empId)
                    );
                    return esSuPase;
                });

                let filtradas = [];
                let labelKPI = '';

                switch (kpiKey) {
                    case 'total':
                        filtradas = todas;
                        labelKPI = 'Total';
                        break;
                    case 'enProceso':
                        filtradas = todas.filter(c => c.estado === 'en_proceso' && c.empleadoAsignado === empId);
                        labelKPI = 'En Proceso';
                        break;
                    case 'enSecretaria':
                        filtradas = todas.filter(c => {
                            if (c.estado !== 'en_secretaria') return false;
                            if (!c.historial) return false;
                            return c.historial.some(h => {
                                const esAccion = h.accion && (h.accion.includes('Devuelto a Secretaría') || h.accion.includes('Enviado a Secretario para consulta'));
                                const esUsuario = h.usuario && (h.usuario === empObj.nombre || h.usuario === empId);
                                return esAccion && esUsuario;
                            });
                        });
                        labelKPI = 'En Secretaría';
                        break;
                    case 'enDefensor':
                        filtradas = todas.filter(c => {
                            if (c.estado !== 'en_defensor') return false;
                            const tieneRelacion = (
                                (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                                (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj.nombre)) ||
                                (c.empleadoOriginal && c.empleadoOriginal === empId)
                            );
                            if (tieneRelacion) return true;
                            if (c.historial) {
                                return c.historial.some(h => h.usuario === empObj.nombre || h.usuario === empId);
                            }
                            return false;
                        });
                        labelKPI = 'En Defensor';
                        break;
                    case 'finalizados':
                        filtradas = todas.filter(c => c.estado === 'finalizada');
                        labelKPI = 'Finalizados';
                        break;
                    case 'conDemora':
                        filtradas = todas.filter(c => {
                            if (c.estado !== 'en_proceso') return false;
                            if (c.empleadoAsignado !== empId) return false;
                            if (!c.fechaLimite) return false;
                            return new Date(c.fechaLimite) < new Date();
                        });
                        labelKPI = 'Con Demora';
                        break;
                    default:
                        filtradas = [];
                        labelKPI = '';
                }

                let tablaHTML = '';
                if (filtradas.length === 0) {
                    tablaHTML = `<p class="text-muted">No hay expedientes para este KPI.</p>`;
                } else {
                    tablaHTML = `
                        <table class="table table-hover table-striped">
                            <thead>
                                <tr>
                                    <th>Expediente</th>
                                    <th>Tipo</th>
                                    <th>Estado</th>
                                    <th>Secretario</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    filtradas.forEach(c => {
                        const expediente = c.numero || c.expediente || c.id; // priorizar numero
                        const tipo = c.tipo || c.motivo || c.tipoPase || 'Pase';
                        const estado = c.estado || 'Sin estado';
                        const secretario = getSecName(c.secretarioId) || '-';
                        tablaHTML += `
                            <tr>
                                <td><a href="#" class="expediente-link">${expediente}</a></td>
                                <td><span class="tipo-negrita-azul">${tipo}</span></td>
                                <td>${estado}</td>
                                <td>${secretario}</td>
                            </tr>
                        `;
                    });
                    tablaHTML += `</tbody></table>`;
                }

                crearModalHistorial();
                const modalEl = document.getElementById('historialModal');
                const titleEl = document.getElementById('historialModalLabel');
                const bodyContainer = document.getElementById('historialTablaContainer');

                titleEl.textContent = `Historial - ${empObj.nombre} (${labelKPI})`;
                bodyContainer.innerHTML = tablaHTML;

                historialModalInstance.show();
            }

            function imprimirTablaHistorial() {
                const container = document.getElementById('historialTablaContainer');
                if (!container) return;

                const contenido = container.innerHTML;
                const printWindow = window.open('', '_blank', 'width=800,height=600');
                if (!printWindow) {
                    showToast('No se pudo abrir la ventana de impresión. Permita ventanas emergentes.', 'warning');
                    return;
                }
                printWindow.document.write(`
                    <html>
                        <head>
                            <title>Historial - Impresión</title>
                            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
                            <style>
                                body { padding: 20px; font-family: 'Inter', sans-serif; }
                                .table { width: 100%; border-collapse: collapse; }
                                .table th, .table td { border: 1px solid #dee2e6; padding: 8px; }
                                .table th { background: #f0f4fa; }
                                .expediente-link { color: #0d6efd; font-weight: 600; text-decoration: none; }
                                .tipo-negrita-azul { font-weight: 700; color: #0d6efd; }
                                h4 { margin-bottom: 20px; }
                            </style>
                        </head>
                        <body>
                            <h4>Historial de expedientes</h4>
                            ${contenido}
                            <p style="margin-top:20px; color:#6c757d; font-size:0.8rem;">Impreso el ${getFechaHoraImpresion()}</p>
                            <script>
                                window.onload = function() { window.print(); window.close(); }
                            <\/script>
                        </body>
                    </html>
                `);
                printWindow.document.close();
            }

            // ---------- DEFENSOR ----------
            function renderDefensor(container) {
                const enSec = causas.filter(c => c.estado === 'en_secretaria').length;
                const enProc = causas.filter(c => c.estado === 'en_proceso').length;
                const enDef = causas.filter(c => c.estado === 'en_defensor').length;
                const fin = causas.filter(c => c.estado === 'finalizada').length;
                const dev = causas.filter(c => c.estado === 'devuelto_siged').length;
                const rem = causas.filter(c => c.estado === 'remitido').length;
                const rech = causas.filter(c => c.estado === 'rechazado').length;

                container.innerHTML = `
                    <div class="kpi-grid">
                        <div class="kpi-item"><div class="kpi-label">En Secretaría</div><div class="kpi-value text-warning">${enSec}</div></div>
                        <div class="kpi-item"><div class="kpi-label">En Proceso</div><div class="kpi-value text-primary">${enProc}</div></div>
                        <div class="kpi-item"><div class="kpi-label">En Defensor</div><div class="kpi-value text-info">${enDef}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Finalizadas</div><div class="kpi-value text-success">${fin}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Devueltas SIGED</div><div class="kpi-value">${dev}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Remitidas</div><div class="kpi-value">${rem}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Rechazadas</div><div class="kpi-value text-danger">${rech}</div></div>
                    </div>
                    <div class="chart-container"><canvas id="chartDefensor"></canvas></div>
                `;

                setTimeout(() => {
                    const ctx = document.getElementById('chartDefensor');
                    if (ctx) {
                        chartInstances.defensor = new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: ['Secretaría', 'En proceso', 'Defensor', 'Finalizada', 'Devuelta SIGED',
                                    'Remitida', 'Rechazada'
                                ],
                                datasets: [{
                                    data: [enSec, enProc, enDef, fin, dev, rem, rech],
                                    backgroundColor: ['#e67e22', '#1976d2', '#7b1fa2', '#2e7d32',
                                        '#c62828', '#3949ab', '#9e9e9e'
                                    ],
                                    borderWidth: 0
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { position: 'bottom' } }
                            }
                        });
                    }
                }, 100);
            }

            // ---------- IMPRESIÓN ----------
            function imprimirModulo(modulo) {
                const printArea = document.getElementById('printArea');
                const contenido = document.getElementById('contenidoModulo');
                const titulo = document.getElementById('tituloModulo').textContent;
                const fechaHora = getFechaHoraImpresion();

                let clon = contenido.cloneNode(true);
                clon.querySelectorAll('select').forEach(el => {
                    const newSelect = el.cloneNode(true);
                    el.parentNode.replaceChild(newSelect, el);
                });

                const canvases = clon.querySelectorAll('canvas');
                canvases.forEach(canvas => {
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/png');
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.style.maxWidth = '500px';
                    canvas.parentNode.replaceChild(img, canvas);
                });

                printArea.innerHTML = `
                    <div style="max-width: 1000px; margin: 0 auto;">
                        <h2 style="font-weight: 700; color: #0a2a44;">${titulo}</h2>
                        <p style="color: #5f7f9f; font-size: 0.9rem; margin-bottom: 1.5rem;">Fecha y hora de impresión: ${fechaHora}</p>
                        ${clon.outerHTML}
                    </div>
                `;

                printArea.style.display = 'block';
                window.print();
                printArea.style.display = 'none';
            }

            // ---------- NAVEGACIÓN ----------
            function initNavigation() {
                document.querySelectorAll('.modulo-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const mod = this.dataset.modulo;
                        renderModulo(mod);
                    });
                });
            }

            // ---------- ACTUALIZAR ----------
            async function actualizarDatos() {
                await loadCausas();
                renderModulo(currentModulo);
                showToast('Datos actualizados', 'info');
            }

            // ---------- INICIALIZACIÓN ----------
            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('btnActualizarBD').addEventListener('click', actualizarDatos);

                initNavigation();

                crearModalHistorial();

                loadCausas().then(() => {
                    renderModulo('resumen');
                });
            });

        })();
    </script>

</body>
</html>
