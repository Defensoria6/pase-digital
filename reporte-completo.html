<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporte Completo · Sistema Digital de Pases</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #eef2f9;
            min-height: 100vh;
            color: #0b1e33;
        }

        #appWrapper {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: #fff;
            border-right: 1px solid #e2edf7;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.02);
        }
        .sidebar .brand {
            padding: 0 1.5rem 1.5rem;
            border-bottom: 1px solid #eef2f7;
            margin-bottom: 1.5rem;
        }
        .sidebar .brand h4 {
            font-weight: 700;
            color: #0a2a44;
            font-size: 1.1rem;
            margin: 0;
        }
        .sidebar .brand small {
            font-size: 0.7rem;
            color: #5f7f9f;
            display: block;
            font-weight: 400;
        }
        .sidebar .nav-modulos {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0 0.75rem;
        }
        .sidebar .nav-modulos .modulo-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.9rem;
            color: #2c5a7a;
            transition: 0.2s;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .sidebar .nav-modulos .modulo-btn:hover {
            background: #f0f6fe;
        }
        .sidebar .nav-modulos .modulo-btn.active {
            background: #e3effa;
            color: #0b4b7a;
            box-shadow: inset 0 0 0 1px rgba(26,107,176,0.12);
        }
        .sidebar .nav-modulos .modulo-btn i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
        .sidebar .footer-sidebar {
            margin-top: auto;
            padding: 1rem 1.5rem;
            border-top: 1px solid #eef2f7;
            font-size: 0.75rem;
            color: #8aa3bc;
            text-align: center;
        }

        .main-content {
            flex: 1;
            padding: 1.8rem 2rem;
            overflow-y: auto;
            height: 100vh;
            background: #f8faff;
        }
        .main-content .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .main-content .page-header h3 {
            font-weight: 700;
            color: #0a2a44;
            margin: 0;
        }
        .main-content .page-header .btn-group {
            display: flex;
            gap: 0.5rem;
        }
        .main-content .page-header .btn-refresh {
            background: #fff;
            border: 1px solid #dce5ec;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1a3a5a;
            transition: .2s;
            cursor: pointer;
        }
        .main-content .page-header .btn-refresh:hover {
            background: #e9eff6;
        }
        .main-content .page-header .btn-print {
            background: #fff;
            border: 1px solid #dce5ec;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1a3a5a;
            transition: .2s;
            cursor: pointer;
        }
        .main-content .page-header .btn-print:hover {
            background: #e9eff6;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .kpi-item {
            background: #fff;
            border-radius: 20px;
            padding: 1.2rem 1rem;
            border: 1px solid #e2edf7;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: box-shadow 0.15s;
            cursor: default;
        }
        .kpi-item:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        }
        .kpi-item .kpi-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #5f7f9f;
        }
        .kpi-item .kpi-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a2a44;
            line-height: 1.2;
        }
        .kpi-item .kpi-value.text-primary { color: #1976d2; }
        .kpi-item .kpi-value.text-success { color: #2e7d32; }
        .kpi-item .kpi-value.text-warning { color: #e67e22; }
        .kpi-item .kpi-value.text-danger { color: #c62828; }
        .kpi-item .kpi-value.text-info { color: #0d6efd; }

        .destacados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .destacado-item {
            background: #fff;
            border-radius: 20px;
            padding: 0.8rem 1.2rem;
            border: 1px solid #e2edf7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .destacado-item .dest-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #5f7f9f;
            letter-spacing: 0.3px;
        }
        .destacado-item .dest-nombre {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0a2a44;
            margin-top: 0.1rem;
        }
        .destacado-item .dest-nombre.text-danger { color: #c62828; }
        .destacado-item .dest-detalle {
            font-size: 0.8rem;
            color: #5f7f9f;
        }

        .chart-container {
            position: relative;
            height: 280px;
            margin: 1rem 0;
        }

        .empleado-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .empleado-selector label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #0a2a44;
        }
        .empleado-selector select {
            border-radius: 40px;
            padding: 6px 18px;
            border: 1px solid #dce5ec;
            font-size: 0.9rem;
            background: #fff;
        }

        .secretarios-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .secretario-card {
            background: #fff;
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid #e2edf7;
            text-align: center;
        }
        .secretario-card h6 {
            font-weight: 700;
            color: #0a2a44;
            margin-bottom: 0.5rem;
        }
        .secretario-card .carga {
            font-size: 2rem;
            font-weight: 800;
            color: #1976d2;
        }
        .secretario-card .detalle {
            font-size: 0.8rem;
            color: #5f7f9f;
            margin-top: 0.25rem;
        }

        .filtros-sec {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .filtros-sec label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #0a2a44;
        }
        .filtros-sec select {
            border-radius: 30px;
            padding: 4px 12px;
            border: 1px solid #dce5ec;
            font-size: 0.8rem;
            background: #fff;
        }

        .empleado-nombre-destacado {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: #f0f8ff;
            border-radius: 16px;
            border: 1px solid #d0e8ff;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #e9eef5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #b0c8dd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8aaec9; }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible !important; }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background: #fff;
                color: #000;
                font-family: 'Inter', sans-serif;
            }
            #printArea .kpi-grid, #printArea .destacados-grid, #printArea .secretarios-container {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }
            #printArea .kpi-item, #printArea .destacado-item, #printArea .secretario-card {
                border: 1px solid #ccc;
                padding: 0.5rem 1rem;
                background: #f9f9f9;
                flex: 1 1 150px;
                min-width: 120px;
            }
            #printArea .chart-container {
                height: 200px;
                page-break-inside: avoid;
            }
            .no-print { display: none !important; }
            .page-header .btn-group { display: none !important; }
        }

        .toast-custom {
            background: rgba(30,43,59,0.92);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 14px 22px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
            pointer-events: auto;
            border-left: 5px solid transparent;
        }
        .toast-custom.success { border-left-color: #4caf50; }
        .toast-custom.warning { border-left-color: #ff9800; }
        .toast-custom.danger { border-left-color: #f44336; }
        .toast-custom.info { border-left-color: #2196f3; }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(30px) scale(0.96); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        .toast-custom.removing {
            animation: fadeOut 0.3s forwards;
        }
        @keyframes fadeOut {
            to { opacity:0; transform:translateY(20px) scale(0.94); }
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: unset; height: auto; border-right: none; border-bottom: 1px solid #e2edf7; flex-direction: row; flex-wrap: wrap; padding: 0.5rem; }
            .sidebar .brand { display: none; }
            .sidebar .nav-modulos { flex-direction: row; flex-wrap: wrap; gap: 0.25rem; padding: 0; }
            .sidebar .nav-modulos .modulo-btn { padding: 6px 12px; font-size: 0.8rem; width: auto; }
            .sidebar .footer-sidebar { display: none; }
            #appWrapper { flex-direction: column; height: 100vh; }
            .main-content { height: calc(100vh - 60px); padding: 1rem; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .secretarios-container { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .kpi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== APP ===== -->
    <div id="appWrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h4>Sistema de Pase Digital</h4>
                <small>Defensoría Civil y Comercial 6</small>
            </div>
            <nav class="nav-modulos">
                <button class="modulo-btn active" data-modulo="resumen"><i class="bi bi-pie-chart-fill"></i> Resumen Global</button>
                <button class="modulo-btn" data-modulo="operador"><i class="bi bi-person-badge"></i> Reporte Operador</button>
                <button class="modulo-btn" data-modulo="secretario"><i class="bi bi-person-lock"></i> Reporte Secretario</button>
                <button class="modulo-btn" data-modulo="empleado"><i class="bi bi-person-check"></i> Reporte Empleados</button>
                <button class="modulo-btn" data-modulo="defensor"><i class="bi bi-gavel"></i> Reporte Defensor</button>
            </nav>
            <div class="footer-sidebar">
                <span>Sistema Digital de Pases 2026</span>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <div class="page-header">
                <h3 id="tituloModulo">Resumen Global</h3>
                <div class="btn-group">
                    <button class="btn-refresh" id="btnActualizarBD"><i class="bi bi-arrow-repeat me-1"></i>Actualizar</button>
                    <button class="btn-print" id="btnImprimir"><i class="bi bi-printer me-1"></i>Imprimir</button>
                </div>
            </div>
            <div id="contenidoModulo">
                <!-- Se llena dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" style="position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; max-width:400px; width:100%;"></div>

    <!-- Área oculta para impresión -->
    <div id="printArea" style="display:none;"></div>

    <script>
        (function() {
            'use strict';

            // ---------- FIREBASE ----------
            const firebaseConfig = {
                apiKey: "AIzaSyBiPiBIUTecqjifyZBqbrNw8aQNv7rwqwA",
                authDomain: "pasedefensoria6.firebaseapp.com",
                projectId: "pasedefensoria6",
                storageBucket: "pasedefensoria6.firebasestorage.app",
                messagingSenderId: "785250989941",
                appId: "1:785250989941:web:1bfb35a5f954144dbb853c"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            // ---------- CONFIG ----------
            const CONFIG = {
                empleados: [
                    { id: 'emp1', nombre: 'Bazante Nadia Romina' },
                    { id: 'emp2', nombre: 'Bolillat Cesar Enrique' },
                    { id: 'emp3', nombre: 'Cardozo Maria Raquel' },
                    { id: 'emp4', nombre: 'Cedron Noelia' },
                    { id: 'emp5', nombre: 'Escobar Monica Graciela' },
                    { id: 'emp6', nombre: 'Fioravante Rómulo' },
                    { id: 'emp7', nombre: 'Gonzalez Alberto Misael' },
                    { id: 'emp8', nombre: 'Gonzalez Juan Jose' },
                    { id: 'emp9', nombre: 'Gudiño Natalia Esther' },
                    { id: 'emp10', nombre: 'Ortega Lucia Noemi' },
                    { id: 'emp11', nombre: 'Pablos Patricia Tamara' },
                    { id: 'emp12', nombre: 'Palacios Ana Gabriela' },
                    { id: 'emp13', nombre: 'Sosa Rita Cecilia' }
                ],
                secretarios: [
                    { id: 'sec1', nombre: 'Corrales A.Mariela' },
                    { id: 'sec2', nombre: 'Riveros Patricia' },
                    { id: 'sec3', nombre: 'Magnani Enzo' }
                ]
            };

            // ---------- ESTADO ----------
            let causas = [];
            let currentModulo = 'resumen';
            let chartInstances = {};
            let empleadoSeleccionado = CONFIG.empleados[0]?.id || '';
            let filtroMes = '';
            let filtroAnio = '';
            let empleadoNombreActual = '';

            // ---------- UTILS ----------
            function getEmpName(id) {
                const e = CONFIG.empleados.find(x => x.id === id);
                return e ? e.nombre : '-';
            }

            function getSecName(id) {
                const s = CONFIG.secretarios.find(x => x.id === id);
                return s ? s.nombre : '-';
            }

            function fmtDt(iso) {
                if (!iso) return '-';
                const d = new Date(iso);
                return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth()+1).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }

            function showToast(msg, type = 'success') {
                const container = document.getElementById('toastContainer');
                const icons = { success: 'bi-check-circle-fill', warning: 'bi-exclamation-triangle-fill',
                    danger: 'bi-x-circle-fill', info: 'bi-info-circle-fill' };
                const div = document.createElement('div');
                div.className = `toast-custom ${type}`;
                div.innerHTML = `<i class="bi ${icons[type] || 'bi-info-circle-fill'}"></i> ${msg}`;
                container.appendChild(div);
                setTimeout(() => {
                    div.classList.add('removing');
                    setTimeout(() => div.remove(), 300);
                }, 3800);
            }

            function esConsultaDeEmpleado(c) {
                if (!c.historial) return false;
                return c.historial.some(h => h.accion && h.accion.toLowerCase().includes('consulta'));
            }

            function calcularDiasRetraso(empId) {
                let total = 0;
                const ahora = Date.now();
                causas.forEach(c => {
                    if (c.empleadoAsignado === empId && c.estado === 'en_proceso' && c.fechaLimite) {
                        const lim = new Date(c.fechaLimite).getTime();
                        if (lim < ahora) {
                            total += (ahora - lim) / (1000 * 60 * 60 * 24);
                        }
                    }
                });
                return total;
            }

            function getFechaHoraImpresion() {
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear();
                const hh = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                return `${dd}/${mm}/${yyyy} · ${hh}:${min}`;
            }

            // ---------- FIRESTORE ----------
            async function loadCausas() {
                try {
                    const snapshot = await db.collection('operador').get();
                    const lista = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (doc.id === 'secretario_config' || doc.id === 'ausencias' || doc.id === 'config') return;
                        if (!data.id) data.id = doc.id;
                        if (!data.empleadoAsignado && data.empleadoId) {
                            data.empleadoAsignado = data.empleadoId;
                        }
                        lista.push(data);
                    });
                    causas = lista;
                    return causas;
                } catch (error) {
                    console.error('Error cargando datos:', error);
                    showToast('Error al cargar datos desde Firestore', 'danger');
                    causas = [];
                    return [];
                }
            }

            // ---------- FUNCIONES DE RENDER ----------
            function renderModulo(modulo) {
                currentModulo = modulo;
                const titulo = document.getElementById('tituloModulo');
                const cont = document.getElementById('contenidoModulo');

                // Destruir gráficos viejos
                Object.values(chartInstances).forEach(ch => { try { ch.destroy(); } catch (_) {} });
                chartInstances = {};

                switch (modulo) {
                    case 'resumen':
                        titulo.textContent = 'Resumen Global';
                        renderResumen(cont);
                        break;
                    case 'operador':
                        titulo.textContent = 'Reporte Operador';
                        renderOperador(cont);
                        break;
                    case 'secretario':
                        titulo.textContent = 'Reporte Secretario';
                        renderSecretario(cont);
                        break;
                    case 'empleado':
                        titulo.textContent = 'Reporte Empleados';
                        renderEmpleado(cont);
                        break;
                    case 'defensor':
                        titulo.textContent = 'Reporte Defensor';
                        renderDefensor(cont);
                        break;
                    default:
                        cont.innerHTML = '<div class="text-muted">Módulo no encontrado</div>';
                }

                document.querySelectorAll('.modulo-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`.modulo-btn[data-modulo="${modulo}"]`)?.classList.add('active');

                const btnPrint = document.getElementById('btnImprimir');
                btnPrint.onclick = function() {
                    imprimirModulo(modulo);
                };
            }

            // ---------- RESUMEN ----------
            function renderResumen(container) {
                const total = causas.length;
                const enSec = causas.filter(c => c.estado === 'en_secretaria').length;
                const enProc = causas.filter(c => c.estado === 'en_proceso').length;
                const enDef = causas.filter(c => c.estado === 'en_defensor').length;
                const fin = causas.filter(c => c.estado === 'finalizada').length;
                const dev = causas.filter(c => c.estado === 'devuelto_siged').length;
                const rem = causas.filter(c => c.estado === 'remitido').length;
                const rech = causas.filter(c => c.estado === 'rechazado').length;

                container.innerHTML = `
                    <div class="kpi-grid">
                        <div class="kpi-item"><div class="kpi-label">Total Causas</div><div class="kpi-value">${total}</div></div>
                        <div class="kpi-item"><div class="kpi-label">En Secretaría</div><div class="kpi-value text-warning">${enSec}</div></div>
                        <div class="kpi-item"><div class="kpi-label">En Proceso</div><div class="kpi-value text-primary">${enProc}</div></div>
                        <div class="kpi-item"><div class="kpi-label">En Defensor</div><div class="kpi-value text-info">${enDef}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Finalizadas</div><div class="kpi-value text-success">${fin}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Devueltas</div><div class="kpi-value">${dev}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Remitidas</div><div class="kpi-value">${rem}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Rechazadas</div><div class="kpi-value text-danger">${rech}</div></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="chart-container"><canvas id="chartResumen"></canvas></div>
                        </div>
                        <div class="col-md-6">
                            <div class="chart-container"><canvas id="chartResumenBarras"></canvas></div>
                        </div>
                    </div>
                `;

                setTimeout(() => {
                    const ctx = document.getElementById('chartResumen');
                    if (ctx) {
                        chartInstances.resumen = new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: ['Secretaría', 'En proceso', 'Defensor', 'Finalizada', 'Devuelta SIGED',

            // ---------- OPERADOR ----------
            function renderOperador(container) {
                const totalPases = causas.filter(c => c.estado === 'en_secretaria').length;
                const totalRechazo = causas.filter(c => c.estado === 'rechazado').length;
                const totalRemitidos = causas.filter(c => c.estado === 'remitido').length;
                const totalDevueltos = causas.filter(c => c.estado === 'devuelto_siged').length;

                const meses = Array.from({ length: 12 }, (_, i) => i + 1);
                const anios = Array.from({ length: 15 }, (_, i) => 2026 + i);

                let htmlFiltros = `
                    <div class="filtros-sec">
                        <label>Mes:</label>
                        <select id="filtroMesSec">
                            <option value="">Todos</option>
                            ${meses.map(m => `<option value="${m}" ${filtroMes == m ? 'selected' : ''}>${m}</option>`).join('')}
                        </select>
                        <label>Año:</label>
                        <select id="filtroAnioSec">
                            <option value="">Todos</option>
                            ${anios.map(a => `<option value="${a}" ${filtroAnio == a ? 'selected' : ''}>${a}</option>`).join('')}
                        </select>
                    </div>
                `;

                const secretarios = CONFIG.secretarios;
                let cards = '';
                secretarios.forEach(sec => {
                    let causasSec = causas.filter(c => c.secretarioId === sec.id);
                    if (filtroMes || filtroAnio) {
                        causasSec = causasSec.filter(c => {
                            if (!c.fechaPaseSecretario) return false;
                            const d = new Date(c.fechaPaseSecretario);
                            let ok = true;
                            if (filtroMes) ok = ok && (d.getMonth() + 1 === parseInt(filtroMes));
                            if (filtroAnio) ok = ok && (d.getFullYear() === parseInt(filtroAnio));
                            return ok;
                        });
                    }
                    const total = causasSec.length;
                    const enProceso = causasSec.filter(c => c.estado === 'en_proceso').length;
                    const finalizadas = causasSec.filter(c => c.estado === 'finalizada').length;
                    cards += `
                        <div class="secretario-card">
                            <h6>${sec.nombre}</h6>
                            <div class="carga">${total}</div>
                            <div class="detalle">En proceso: ${enProceso} · Finalizadas: ${finalizadas}</div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="kpi-grid">
                        <div class="kpi-item"><div class="kpi-label">Total Pases a Secretario</div><div class="kpi-value text-primary">${totalPases}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Total Rechazo</div><div class="kpi-value text-danger">${totalRechazo}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Total Remitidos</div><div class="kpi-value text-warning">${totalRemitidos}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Total Devueltos</div><div class="kpi-value">${totalDevueltos}</div></div>
                    </div>
                    ${htmlFiltros}
                    <div class="secretarios-container">
                        ${cards}
                    </div>
                    <div class="text-muted mt-3" style="font-size:0.9rem;">
                        <i class="bi bi-info-circle"></i> Los filtros afectan la carga de cada secretario.
                    </div>
                `;

                document.getElementById('filtroMesSec').addEventListener('change', function() {
                    filtroMes = this.value;
                    renderModulo('operador');
                });
                document.getElementById('filtroAnioSec').addEventListener('change', function() {
                    filtroAnio = this.value;
                    renderModulo('operador');
                });
            }

            // ---------- SECRETARIO ----------
            function renderSecretario(container) {
                const totalSinAsignar = causas.filter(c => {
                    if (c.estado !== 'en_secretaria') return false;
                    return !esConsultaDeEmpleado(c);
                }).length;

                const enProceso = causas.filter(c => c.estado === 'en_proceso').length;
                const paraFinalizar = causas.filter(c => {
                    if (c.estado !== 'en_secretaria') return false;
                    return esConsultaDeEmpleado(c);
                }).length;
                const enDefensor = causas.filter(c => c.estado === 'en_defensor').length;
                const finalizados = causas.filter(c => c.estado === 'finalizada').length;

                let mejorCumplimiento = { id: null, nombre: 'N/A', count: -1 };
                let mayorCarga = { id: null, nombre: 'N/A', count: -1 };
                let mayorDemora = { id: null, nombre: 'N/A', dias: -1 };

                CONFIG.empleados.forEach(emp => {
                    const finalizadasEmp = causas.filter(c => c.estado === 'finalizada' && (c.empleadoAsignado ===
                        emp.id || c.empleadoOriginal === emp.id)).length;
                    if (finalizadasEmp > mejorCumplimiento.count) {
                        mejorCumplimiento = { id: emp.id, nombre: emp.nombre, count: finalizadasEmp };
                    }
                    const totalEmp = causas.filter(c => c.empleadoAsignado === emp.id || c.empleadoOriginal === emp.id)
                        .length;
                    if (totalEmp > mayorCarga.count) {
                        mayorCarga = { id: emp.id, nombre: emp.nombre, count: totalEmp };
                    }
                    const dias = calcularDiasRetraso(emp.id);
                    if (dias > mayorDemora.dias) {
                        mayorDemora = { id: emp.id, nombre: emp.nombre, dias };
                    }
                });

                const empCarga = CONFIG.empleados.map(emp => {
                    const total = causas.filter(c => c.empleadoAsignado === emp.id || c.empleadoOriginal === emp.id)
                        .length;
                    return { nombre: emp.nombre, total };
                });
                empCarga.sort((a, b) => b.total - a.total);

                container.innerHTML = `
                    <div class="kpi-grid">
                        <div class="kpi-item"><div class="kpi-label">Total Sin Asignar</div><div class="kpi-value text-warning">${totalSinAsignar}</div></div>
                        <div class="kpi-item"><div class="kpi-label">En Proceso</div><div class="kpi-value text-primary">${enProceso}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Para Finalizar</div><div class="kpi-value text-success">${paraFinalizar}</div></div>
                        <div class="kpi-item"><div class="kpi-label">En Defensor</div><div class="kpi-value text-info">${enDefensor}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Finalizados</div><div class="kpi-value" style="color:#2e7d32;">${finalizados}</div></div>
                    </div>

                    <div class="destacados-grid">
                        <div class="destacado-item">
                            <div class="dest-label">🏆 Mejor Cumplimiento</div>
                            <div class="dest-nombre">${mejorCumplimiento.nombre}</div>
                            <div class="dest-detalle">${mejorCumplimiento.count} causas finalizadas</div>
                        </div>
                        <div class="destacado-item">
                            <div class="dest-label">📊 Mayor Carga</div>
                            <div class="dest-nombre">${mayorCarga.nombre}</div>
                            <div class="dest-detalle">${mayorCarga.count} expedientes en total</div>
                        </div>
                        <div class="destacado-item">
                            <div class="dest-label">⏳ Mayor Demora</div>
                            <div class="dest-nombre text-danger">${mayorDemora.nombre}</div>
                            <div class="dest-detalle">${mayorDemora.dias > 0 ? mayorDemora.dias.toFixed(1) + ' días de retraso' : 'Sin retrasos'}</div>
                        </div>
                    </div>

                    <div class="chart-container"><canvas id="chartCargaSecretario"></canvas></div>
                `;

                setTimeout(() => {
                    const ctx = document.getElementById('chartCargaSecretario');
                    if (ctx) {
                        chartInstances.cargaSecretario = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: empCarga.map(e => e.nombre.split(' ').slice(0, 2).join(' ')),
                                datasets: [{
                                    label: 'Carga histórica',
                                    data: empCarga.map(e => e.total),
                                    backgroundColor: empCarga.map(e => e.total >= 20 ?
                                        '#c62828' : e.total > 15 ? '#e67e22' :
                                        '#1976d2'),
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                            }
                        });
                    }
                }, 100);
            }

            // ---------- EMPLEADO (CON GRÁFICO DE BARRAS DE KPIs Y CLICK EN BARRA) ----------
            function renderEmpleado(container) {
                let empId = empleadoSeleccionado;
                let empObj = CONFIG.empleados.find(e => e.id === empId);
                let nombreEmpleado = empObj ? empObj.nombre : 'Seleccione un empleado';

                // Función para calcular KPIs de un empleado
                function calcularKPIs(empId, empObj) {
                    let total = 0,
                        enProceso = 0,
                        enSecretaria = 0,
                        enDefensor = 0,
                        finalizados = 0,
                        conDemora = 0;

                    if (empObj) {
                        const todas = causas.filter(c => {
                            const esSuPase = (
                                (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                                (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj
                                    .nombre)) ||
                                (c.empleadoOriginal && c.empleadoOriginal === empId)
                            );
                            return esSuPase;
                        });

                        total = todas.length;
                        enProceso = todas.filter(c => c.estado === 'en_proceso' && c.empleadoAsignado === empId).length;
                        finalizados = todas.filter(c => c.estado === 'finalizada').length;

                        enSecretaria = todas.filter(c => {
                            if (c.estado !== 'en_secretaria') return false;
                            if (!c.historial) return false;
                            return c.historial.some(h => {
                                const esAccion = h.accion && (h.accion.includes('Devuelto a Secretaría') || h
                                    .accion.includes('Enviado a Secretario para consulta'));
                                const esUsuario = h.usuario && (h.usuario === empObj.nombre || h.usuario ===
                                    empId);
                                return esAccion && esUsuario;
                            });
                        }).length;

                        enDefensor = todas.filter(c => {
                            if (c.estado !== 'en_defensor') return false;
                            const tieneRelacion = (
                                (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                                (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj
                                    .nombre)) ||
                                (c.empleadoOriginal && c.empleadoOriginal === empId)
                            );
                            if (tieneRelacion) return true;
                            if (c.historial) {
                                return c.historial.some(h => h.usuario === empObj.nombre || h.usuario === empId);
                            }
                            return false;
                        }).length;

                        conDemora = todas.filter(c => {
                            if (c.estado !== 'en_proceso') return false;
                            if (c.empleadoAsignado !== empId) return false;
                            if (!c.fechaLimite) return false;
                            return new Date(c.fechaLimite) < new Date();
                        }).length;
                    }

                    return { total, enProceso, enSecretaria, enDefensor, finalizados, conDemora, nombre: empObj ? empObj.nombre : '' };
                }

                // Selector de empleado
                let opts = CONFIG.empleados.map(e =>
                    `<option value="${e.id}" ${e.id === empleadoSeleccionado ? 'selected' : ''}>${e.nombre}</option>`
                ).join('');

                // Obtener KPIs actuales
                let kpis = calcularKPIs(empId, empObj);
                empleadoNombreActual = kpis.nombre;

                // Construir HTML
                container.innerHTML = `
                    <div class="empleado-selector">
                        <label for="selectEmpleado">Seleccionar empleado:</label>
                        <select id="selectEmpleado" class="form-select" style="width:auto;min-width:200px;">${opts}</select>
                    </div>

                    <!-- Nombre del empleado en negrita azul -->
                    <div id="empleadoNombreDestacado" class="empleado-nombre-destacado">
                        ${empleadoNombreActual || 'Seleccione un empleado'}
                    </div>

                    <!-- Gráfico de barras (KPIs del empleado seleccionado) -->
                    <div class="chart-container"><canvas id="chartKPIsEmpleado"></canvas></div>

                    <!-- KPIs del empleado seleccionado -->
                    <div id="kpisEmpleadoContainer" class="kpi-grid">
                        <div class="kpi-item" data-kpi="total">
                            <div class="kpi-label">Total</div>
                            <div class="kpi-value">${kpis.total}</div>
                        </div>
                        <div class="kpi-item" data-kpi="enProceso">
                            <div class="kpi-label">En Proceso</div>
                            <div class="kpi-value text-primary">${kpis.enProceso}</div>
                        </div>
                        <div class="kpi-item" data-kpi="enSecretaria">
                            <div class="kpi-label">En Secretaría</div>
                            <div class="kpi-value text-warning">${kpis.enSecretaria}</div>
                        </div>
                        <div class="kpi-item" data-kpi="enDefensor">
                            <div class="kpi-label">En Defensor</div>
                            <div class="kpi-value text-info">${kpis.enDefensor}</div>
                        </div>
                        <div class="kpi-item" data-kpi="finalizados">
                            <div class="kpi-label">Finalizados</div>
                            <div class="kpi-value text-success">${kpis.finalizados}</div>
                        </div>
                        <div class="kpi-item" data-kpi="conDemora">
                            <div class="kpi-label">Con Demora</div>
                            <div class="kpi-value text-danger">${kpis.conDemora}</div>
                        </div>
                    </div>
                `;

                // Renderizar gráfico de barras con los KPIs
                setTimeout(() => {
                    const ctx = document.getElementById('chartKPIsEmpleado');
                    if (ctx) {
                        if (chartInstances.kpisEmpleado) chartInstances.kpisEmpleado.destroy();
                        chartInstances.kpisEmpleado = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: ['Total', 'En Proceso', 'En Secretaría', 'En Defensor', 'Finalizados', 'Con Demora'],
                                datasets: [{
                                    label: empleadoNombreActual || 'Empleado',
                                    data: [kpis.total, kpis.enProceso, kpis.enSecretaria, kpis.enDefensor, kpis.finalizados, kpis.conDemora],
                                    backgroundColor: ['#0a2a44', '#1976d2', '#e67e22', '#7b1fa2', '#2e7d32', '#c62828'],
                                    borderRadius: 6,
                                    borderColor: '#fff',
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        callbacks: {
                                            label: function(context) {
                                                return context.parsed.y + ' causas';
                                            }
                                        }
                                    }
                                },
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: { stepSize: 1 }
                                    }
                                },
                                onClick: function(event, elements) {
                                    if (elements.length > 0) {
                                        const index = elements[0].index;
                                        const labels = ['total', 'enProceso', 'enSecretaria', 'enDefensor', 'finalizados', 'conDemora'];
                                        const kpiKey = labels[index];
                                        // Actualizar KPIs destacando el seleccionado
                                        actualizarKPIsDestacado(kpiKey);
                                    }
                                }
                            }
                        });
                    }
                }, 100);

                // Evento de cambio de empleado
                document.getElementById('selectEmpleado').addEventListener('change', function() {
                    empleadoSeleccionado = this.value;
                    renderModulo('empleado');
                });
            }

            // Función para actualizar KPIs destacando el seleccionado
            function actualizarKPIsDestacado(kpiKey) {
                const container = document.getElementById('kpisEmpleadoContainer');
                if (!container) return;

                // Obtener el empleado actual
                let empId = empleadoSeleccionado;
                let empObj = CONFIG.empleados.find(e => e.id === empId);
                if (!empObj) return;

                // Recalcular KPIs
                const todas = causas.filter(c => {
                    const esSuPase = (
                        (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                        (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj.nombre)) ||
                        (c.empleadoOriginal && c.empleadoOriginal === empId)
                    );
                    return esSuPase;
                });

                const kpis = {
                    total: todas.length,
                    enProceso: todas.filter(c => c.estado === 'en_proceso' && c.empleadoAsignado === empId).length,
                    finalizados: todas.filter(c => c.estado === 'finalizada').length,
                    enSecretaria: todas.filter(c => {
                        if (c.estado !== 'en_secretaria') return false;
                        if (!c.historial) return false;
                        return c.historial.some(h => {
                            const esAccion = h.accion && (h.accion.includes('Devuelto a Secretaría') || h.accion.includes('Enviado a Secretario para consulta'));
                            const esUsuario = h.usuario && (h.usuario === empObj.nombre || h.usuario === empId);
                            return esAccion && esUsuario;
                        });
                    }).length,
                    enDefensor: todas.filter(c => {
                        if (c.estado !== 'en_defensor') return false;
                        const tieneRelacion = (
                            (c.empleadoId && (c.empleadoId === empId || c.empleadoId === empObj.nombre)) ||
                            (c.empleadoAsignado && (c.empleadoAsignado === empId || c.empleadoAsignado === empObj.nombre)) ||
                            (c.empleadoOriginal && c.empleadoOriginal === empId)
                        );
                        if (tieneRelacion) return true;
                        if (c.historial) {
                            return c.historial.some(h => h.usuario === empObj.nombre || h.usuario === empId);
                        }
                        return false;
                    }).length,
                    conDemora: todas.filter(c => {
                        if (c.estado !== 'en_proceso') return false;
                        if (c.empleadoAsignado !== empId) return false;
                        if (!c.fechaLimite) return false;
                        return new Date(c.fechaLimite) < new Date();
                    }).length
                };

                // Mapeo de etiquetas
                const labels = {
                    total: 'Total',
                    enProceso: 'En Proceso',
                    enSecretaria: 'En Secretaría',
                    enDefensor: 'En Defensor',
                    finalizados: 'Finalizados',
                    conDemora: 'Con Demora'
                };

                // Actualizar cada KPI
                const items = container.querySelectorAll('.kpi-item');
                items.forEach(item => {
                    const key = item.dataset.kpi;
                    const valueSpan = item.querySelector('.kpi-value');
                    if (key && valueSpan) {
                        const val = kpis[key] !== undefined ? kpis[key] : 0;
                        valueSpan.textContent = val;
                        // Resaltar el seleccionado
                        item.style.border = (key === kpiKey) ? '3px solid #0d6efd' : '1px solid #e2edf7';
                        item.style.background = (key === kpiKey) ? '#e8f4ff' : '#fff';
                    }
                });

                // Actualizar el gráfico con los nuevos datos
                const ctx = document.getElementById('chartKPIsEmpleado');
                if (ctx && chartInstances.kpisEmpleado) {
                    chartInstances.kpisEmpleado.data.datasets[0].data = [kpis.total, kpis.enProceso, kpis.enSecretaria, kpis.enDefensor, kpis.finalizados, kpis.conDemora];
                    chartInstances.kpisEmpleado.update();
                }

                // Mostrar el nombre del empleado en el título del gráfico
                if (chartInstances.kpisEmpleado) {
                    chartInstances.kpisEmpleado.data.datasets[0].label = empObj.nombre;
                    chartInstances.kpisEmpleado.update();
                }

                // Actualizar el nombre destacado
                const nombreDiv = document.getElementById('empleadoNombreDestacado');
                if (nombreDiv) {
                    nombreDiv.textContent = empObj.nombre;
                }
            }

            // ---------- DEFENSOR ----------
            function renderDefensor(container) {
                const enSec = causas.filter(c => c.estado === 'en_secretaria').length;
                const enProc = causas.filter(c => c.estado === 'en_proceso').length;

                        <div class="kpi-item"><div class="kpi-label">En Proceso</div><div class="kpi-value text-primary">${enProc}</div></div>

                        <div class="kpi-item"><div class="kpi-label">Remitidas</div><div class="kpi-value">${rem}</div></div>
                        <div class="kpi-item"><div class="kpi-label">Rechazadas</div><div class="kpi-value text-danger">${rech}</div></div>
                    </div>

                `;

                setTimeout(() => {
                    const ctx = document.getElementById('chartDefensor');

                        chartInstances.defensor = new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: ['Secretaría', 'En proceso', 'Defensor', 'Finalizada', 'Devuelta SIGED',
                                    'Remitida', 'Rechazada'
                                ],
                                datasets: [{
                                    data: [enSec, enProc, enDef, fin, dev, rem, rech],
                                    backgroundColor: ['#e67e22', '#1976d2', '#7b1fa2', '#2e7d32',
                                        '#c62828', '#3949ab', '#9e9e9e'
                                    ],
                                    borderWidth: 0
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { position: 'bottom' } }
                            }
                        });
                    }
                }, 100);
            }

            // ---------- IMPRESIÓN ----------
            function imprimirModulo(modulo) {
                const printArea = document.getElementById('printArea');
                const contenido = document.getElementById('contenidoModulo');
                const titulo = document.getElementById('tituloModulo').textContent;
                const fechaHora = getFechaHoraImpresion();

                let clon = contenido.cloneNode(true);
                clon.querySelectorAll('select').forEach(el => {
                    const newSelect = el.cloneNode(true);
                    el.parentNode.replaceChild(newSelect, el);
                });

                const canvases = clon.querySelectorAll('canvas');
                canvases.forEach(canvas => {
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/png');
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.style.maxWidth = '500px';
                    canvas.parentNode.replaceChild(img, canvas);
                });

                printArea.innerHTML = `
                    <div style="max-width: 1000px; margin: 0 auto;">
                        <h2 style="font-weight: 700; color: #0a2a44;">${titulo}</h2>
                        <p style="color: #5f7f9f; font-size: 0.9rem; margin-bottom: 1.5rem;">Fecha y hora de impresión: ${fechaHora}</p>
                        ${clon.outerHTML}
                    </div>
                `;

                printArea.style.display = 'block';
                window.print();
                printArea.style.display = 'none';
            }

            // ---------- NAVEGACIÓN ----------
            function initNavigation() {
                document.querySelectorAll('.modulo-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const mod = this.dataset.modulo;
                        renderModulo(mod);
                    });
                });
            }

            // ---------- ACTUALIZAR ----------
            async function actualizarDatos() {
                await loadCausas();
                renderModulo(currentModulo);
                showToast('Datos actualizados', 'info');
            }

            // ---------- INICIALIZACIÓN ----------
            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('btnActualizarBD').addEventListener('click', actualizarDatos);

                initNavigation();

                loadCausas().then(() => {
                    renderModulo('resumen');
                });
            });

        })();
    </script>

</body>
</html>
