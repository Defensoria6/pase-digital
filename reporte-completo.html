<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporte Completo · Sistema Digital de Pases</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #eef2f9;
            min-height: 100vh;
            color: #0b1e33;
        }

        #appWrapper {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: #fff;
            border-right: 1px solid #e2edf7;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.02);
        }
        .sidebar .brand {
            padding: 0 1.5rem 1.5rem;
            border-bottom: 1px solid #eef2f7;
            margin-bottom: 1.5rem;
        }
        .sidebar .brand h4 {
            font-weight: 700;
            color: #0a2a44;
            font-size: 1.1rem;
            margin: 0;
        }
        .sidebar .brand small {
            font-size: 0.7rem;
            color: #5f7f9f;
            display: block;
            font-weight: 400;
        }
        .sidebar .nav-modulos {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0 0.75rem;
        }
        .sidebar .nav-modulos .modulo-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.9rem;
            color: #2c5a7a;
            transition: 0.2s;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .sidebar .nav-modulos .modulo-btn:hover {
            background: #f0f6fe;
        }
        .sidebar .nav-modulos .modulo-btn.active {
            background: #e3effa;
            color: #0b4b7a;
            box-shadow: inset 0 0 0 1px rgba(26,107,176,0.12);
        }
        .sidebar .nav-modulos .modulo-btn i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
        .sidebar .footer-sidebar {
            margin-top: auto;
            padding: 1rem 1.5rem;
            border-top: 1px solid #eef2f7;
            font-size: 0.75rem;
            color: #8aa3bc;
            text-align: center;
        }

        .main-content {
            flex: 1;
            padding: 1.8rem 2rem;
            overflow-y: auto;
            height: 100vh;
            background: #f8faff;
        }
        .main-content .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .main-content .page-header h3 {
            font-weight: 700;
            color: #0a2a44;
            margin: 0;
        }
        .main-content .page-header .btn-group {
            display: flex;
            gap: 0.5rem;
        }
        .main-content .page-header .btn-refresh {
            background: #fff;
            border: 1px solid #dce5ec;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1a3a5a;
            transition: .2s;
            cursor: pointer;
        }
        .main-content .page-header .btn-refresh:hover {
            background: #e9eff6;
        }
        .main-content .page-header .btn-print {
            background: #fff;
            border: 1px solid #dce5ec;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1a3a5a;
            transition: .2s;
            cursor: pointer;
        }
        .main-content .page-header .btn-print:hover {
            background: #e9eff6;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .kpi-item {
            background: #fff;
            border-radius: 20px;
            padding: 1.2rem 1rem;
            border: 1px solid #e2edf7;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: box-shadow 0.15s;
            cursor: default;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .kpi-item:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        }
        .kpi-item .kpi-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #5f7f9f;
        }
        .kpi-item .kpi-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a2a44;
            line-height: 1.2;
        }
        .kpi-item .kpi-value.text-primary { color: #1976d2; }
        .kpi-item .kpi-value.text-success { color: #2e7d32; }
        .kpi-item .kpi-value.text-warning { color: #e67e22; }
        .kpi-item .kpi-value.text-danger { color: #c62828; }
        .kpi-item .kpi-value.text-info { color: #0d6efd; }
        .kpi-item .ver-historial-btn {
            margin-top: 8px;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 30px;
        }

        .destacados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .destacado-item {
            background: #fff;
            border-radius: 20px;
            padding: 0.8rem 1.2rem;
            border: 1px solid #e2edf7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .destacado-item .dest-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #5f7f9f;
            letter-spacing: 0.3px;
        }
        .destacado-item .dest-nombre {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0a2a44;
            margin-top: 0.1rem;
        }
        .destacado-item .dest-nombre.text-danger { color: #c62828; }
        .destacado-item .dest-detalle {
            font-size: 0.8rem;
            color: #5f7f9f;
        }

        .chart-container {
            position: relative;
            height: 280px;
            margin: 1rem 0;
        }

        .empleado-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .empleado-selector label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #0a2a44;
        }
        .empleado-selector select {
            border-radius: 40px;
            padding: 6px 18px;
            border: 1px solid #dce5ec;
            font-size: 0.9rem;
            background: #fff;
        }

        .secretarios-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .secretario-card {
            background: #fff;
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid #e2edf7;
            text-align: center;
        }
        .secretario-card h6 {
            font-weight: 700;
            color: #0a2a44;
            margin-bottom: 0.5rem;
        }
        .secretario-card .carga {
            font-size: 2rem;
            font-weight: 800;
            color: #1976d2;
        }
        .secretario-card .detalle {
            font-size: 0.8rem;
            color: #5f7f9f;
            margin-top: 0.25rem;
        }

        .filtros-sec {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .filtros-sec label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #0a2a44;
        }
        .filtros-sec select {
            border-radius: 30px;
            padding: 4px 12px;
            border: 1px solid #dce5ec;
            font-size: 0.8rem;
            background: #fff;
        }

        .empleado-nombre-destacado {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: #f0f8ff;
            border-radius: 16px;
            border: 1px solid #d0e8ff;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #e9eef5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #b0c8dd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8aaec9; }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible !important; }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background: #fff;
                color: #000;
                font-family: 'Inter', sans-serif;
            }
            #printArea .kpi-grid, #printArea .destacados-grid, #printArea .secretarios-container {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }
            #printArea .kpi-item, #printArea .destacado-item, #printArea .secretario-card {
                border: 1px solid #ccc;
                padding: 0.5rem 1rem;
                background: #f9f9f9;
                flex: 1 1 150px;
                min-width: 120px;
            }
            #printArea .chart-container {
                height: 200px;
                page-break-inside: avoid;
            }
            .no-print { display: none !important; }
            .page-header .btn-group { display: none !important; }
        }

        .toast-custom {
            background: rgba(30,43,59,0.92);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 14px 22px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
            pointer-events: auto;
            border-left: 5px solid transparent;
        }
        .toast-custom.success { border-left-color: #4caf50; }
        .toast-custom.warning { border-left-color: #ff9800; }
        .toast-custom.danger { border-left-color: #f44336; }
        .toast-custom.info { border-left-color: #2196f3; }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(30px) scale(0.96); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        .toast-custom.removing {
            animation: fadeOut 0.3s forwards;
        }
        @keyframes fadeOut {
            to { opacity:0; transform:translateY(20px) scale(0.94); }
        }

        /* Estilos para el modal de historial */
        #historialModal .modal-body {
            max-height: 70vh;
            overflow-y: auto;
        }
        #historialModal .table th {
            background: #f0f4fa;
        }
        #historialModal .expediente-link {
            color: #0d6efd;
            font-weight: 600;
            text-decoration: none;
        }
        #historialModal .expediente-link:hover {
            text-decoration: underline;
        }
        .tipo-negrita-azul {
            font-weight: 700;
            color: #0d6efd;
        }

        /* Estilos para tabla de empleados con filtros */
        .tabla-empleados-container {
            background: #fff;
            border-radius: 20px;
            border: 1px solid #e2edf7;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .tabla-empleados-container .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
        }
        .tabla-empleados-container .table th {
            background: #f0f4fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .tabla-empleados-container .btn-print-tabla {
            float: right;
            margin-bottom: 0.5rem;
        }
        .demora-si { font-weight: 700; color: #c62828; }
        .demora-no { font-weight: 700; color: #2e7d32; }

        .filtros-empleados {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
        }
        .filtros-empleados label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #0a2a44;
            margin-bottom: 0;
        }
        .filtros-empleados select {
            border-radius: 30px;
            padding: 4px 12px;
            border: 1px solid #dce5ec;
            font-size: 0.8rem;
            background: #fff;
            min-width: 120px;
        }
        .filtros-empleados .btn-limpiar {
            padding: 4px 16px;
            border-radius: 30px;
            background: #f0f4f9;
            border: 1px solid #dce5ec;
            font-size: 0.75rem;
            cursor: pointer;
            transition: .15s;
        }
        .filtros-empleados .btn-limpiar:hover {
            background: #dce5ec;
        }

        .pagination-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.5rem;
            border-top: 1px solid #eef2f7;
            margin-top: 0.5rem;
        }
        .pagination-bar .info {
            font-size: 0.75rem;
            color: #5f7f9f;
        }
        .pagination-bar .page-btn {
            background: #f0f4f9;
            border: none;
            border-radius: 30px;
            padding: 2px 10px;
            font-weight: 600;
            color: #1a4c74;
            margin: 0 2px;
            cursor: pointer;
            transition: .15s;
            font-size: 0.75rem;
        }
        .pagination-bar .page-btn.active {
            background: #1976d2;
            color: #fff;
        }
        .pagination-bar .page-btn:disabled {
            opacity: .4;
            pointer-events: none;
        }
        .pagination-bar .page-btn:hover:not(:disabled) {
            background: #d0e0f0;
        }
        .pagination-bar .page-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        .pagination-bar .page-selector select {
            padding: 2px 6px;
            border-radius: 30px;
            border: 1px solid #dce5ec;
            background: #fff;
            font-size: 0.75rem;
        }

        .total-filtro-kpi {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 0.5rem 0.5rem 0.5rem 1rem;
            background: #f8faff;
            border-radius: 16px;
            border: 1px solid #e2edf7;
            margin-bottom: 0.75rem;
        }
        .total-filtro-kpi .total-kpi {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0a2a44;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .total-filtro-kpi .total-kpi .cantidad {
            color: #1976d2;
            font-size: 1.6rem;
        }
        .total-filtro-kpi .filtro-activo {
            font-size: 0.9rem;
            color: #2c5a7a;
            font-weight: 600;
            padding: 4px 16px;
            background: #e3effa;
            border-radius: 40px;
            border: 1px solid #b8d4f0;
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: unset; height: auto; border-right: none; border-bottom: 1px solid #e2edf7; flex-direction: row; flex-wrap: wrap; padding: 0.5rem; }
            .sidebar .brand { display: none; }
            .sidebar .nav-modulos { flex-direction: row; flex-wrap: wrap; gap: 0.25rem; padding: 0; }
            .sidebar .nav-modulos .modulo-btn { padding: 6px 12px; font-size: 0.8rem; width: auto; }
            .sidebar .footer-sidebar { display: none; }
            #appWrapper { flex-direction: column; height: 100vh; }
            .main-content { height: calc(100vh - 60px); padding: 1rem; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .secretarios-container { grid-template-columns: 1fr; }
            .tabla-empleados-container .table-wrapper { max-height: 300px; }
            .filtros-empleados { flex-direction: column; align-items: stretch; }
            .filtros-empleados select { width: 100%; }
            .total-filtro-kpi { flex-direction: column; align-items: stretch; gap: 0.5rem; }
            .total-filtro-kpi .filtro-activo { text-align: center; }
        }
        @media (max-width: 480px) {
            .kpi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== APP ===== -->
    <div id="appWrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h4>Sistema de Pase Digital</h4>
                <small>Defensoría Civil y Comercial 6</small>
            </div>
            <nav class="nav-modulos">
                <button class="modulo-btn active" data-modulo="resumen"><i class="bi bi-pie-chart-fill"></i> Resumen Global</button>
                <button class="modulo-btn" data-modulo="operador"><i class="bi bi-person-badge"></i> Reporte Operador</button>
                <button class="modulo-btn" data-modulo="secretario"><i class="bi bi-person-lock"></i> Reporte Secretario</button>
                <button class="modulo-btn" data-modulo="empleado"><i class="bi bi-person-check"></i> Reporte Empleados</button>
                <button class="modulo-btn" data-modulo="defensor"><i class="bi bi-gavel"></i> Reporte Defensor</button>
            </nav>
            <div class="footer-sidebar">
                <span>Sistema Digital de Pases 2026</span>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <div class="page-header">
                <h3 id="tituloModulo">Resumen Global</h3>
                <div class="btn-group">
                    <button class="btn-refresh" id="btnActualizarBD"><i class="bi bi-arrow-repeat me-1"></i>Actualizar</button>
                    <button class="btn-print" id="btnImprimir"><i class="bi bi-printer me-1"></i>Imprimir</button>
                </div>
            </div>
            <div id="contenidoModulo">
                <!-- Se llena dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" style="position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; max-width:400px; width:100%;"></div>

    <!-- Área oculta para impresión -->
    <div id="printArea" style="display:none;"></div>

    <!-- Bootstrap JS (necesario para modales) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function() {
            'use strict';

            // ---------- FIREBASE ----------
            const firebaseConfig = {
                apiKey: "AIzaSyBiPiBIUTecqjifyZBqbrNw8aQNv7rwqwA",
                authDomain: "pasedefensoria6.firebaseapp.com",
                projectId: "pasedefensoria6",

                messagingSenderId: "785250989941",

            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            // ---------- CONFIG ----------
            const CONFIG = {
                empleados: [
                    { id: 'emp1', nombre: 'Bazante Nadia Romina' },
                    { id: 'emp2', nombre: 'Bolillat Cesar Enrique' },
                    { id: 'emp3', nombre: 'Cardozo Maria Raquel' },
                    { id: 'emp4', nombre: 'Cedron Noelia' },
                    { id: 'emp5', nombre: 'Escobar Monica Graciela' },
                    { id: 'emp6', nombre: 'Fioravante Rómulo' },
                    { id: 'emp7', nombre: 'Gonzalez Alberto Misael' },
                    { id: 'emp8', nombre: 'Gonzalez Juan Jose' },
                    { id: 'emp9', nombre: 'Gudiño Natalia Esther' },
                    { id: 'emp10', nombre: 'Ortega Lucia Noemi' },
                    { id: 'emp11', nombre: 'Pablos Patricia Tamara' },
                    { id: 'emp12', nombre: 'Palacios Ana Gabriela' },
                    { id: 'emp13', nombre: 'Sosa Rita Cecilia' }
                ],
                secretarios: [
                    { id: 'sec1', nombre: 'Corrales A.Mariela' },
                    { id: 'sec2', nombre: 'Riveros Patricia' },
                    { id: 'sec3', nombre: 'Magnani Enzo' }
                ]
            };

            // ---------- ESTADO ----------
            let causas = [];
            let currentModulo = 'resumen';
            let chartInstances = {};
            let empleadoSeleccionado = CONFIG.empleados[0]?.id || '';
            let filtroMes = '';
            let filtroAnio = '';
            let empleadoNombreActual = '';

            // Estado para filtros y paginación del módulo empleado
            let filtrosEmpleado = {
                empleado: 'todos',

            };
            let paginacionEmpleado = { page: 1, perPage: 10 };

            // ---------- UTILS ----------
            function getEmpName(id) {
                const e = CONFIG.empleados.find(x => x.id === id);
                return e ? e.nombre : '-';
            }

            function getSecName(id) {
                const s = CONFIG.secretarios.find(x => x.id === id);
                return s ? s.nombre : '-';
            }

            function fmtDt(iso) {
                if (!iso) return '-';
                const d = new Date(iso);
                return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth()+1).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }

            function showToast(msg, type = 'success') {
                const container = document.getElementById('toastContainer');
                const icons = { success: 'bi-check-circle-fill', warning: 'bi-exclamation-triangle-fill',
                    danger: 'bi-x-circle-fill', info: 'bi-info-circle-fill' };
                const div = document.createElement('div');
                div.className = `toast-custom ${type}`;
                div.innerHTML = `<i class="bi ${icons[type] || 'bi-info-circle-fill'}"></i> ${msg}`;
                container.appendChild(div);
                setTimeout(() => {
                    div.classList.add('removing');
                    setTimeout(() => div.remove(), 300);
                }, 3800);
            }

            function esConsultaDeEmpleado(c) {
                if (!c.historial) return false;
                return c.historial.some(h => h.accion && h.accion.toLowerCase().includes('consulta'));
            }

            function calcularDiasRetraso(empId) {
                let total = 0;
                const ahora = Date.now();
                causas.forEach(c => {
                    if (c.empleadoAsignado === empId && c.estado === 'en_proceso' && c.fechaLimite) {
                        const lim = new Date(c.fechaLimite).getTime();
                        if (lim < ahora) {
                            total += (ahora - lim) / (1000 * 60 * 60 * 24);
                        }
                    }
                });
                return total;
            }

            function getFechaHoraImpresion() {
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear();
                const hh = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                return `${dd}/${mm}/${yyyy} · ${hh}:${min}`;
            }

            // ---------- FIRESTORE ----------
            async function loadCausas() {
                try {
                    const snapshot = await db.collection('operador').get();
                    const lista = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (doc.id === 'secretario_config' || doc.id === 'ausencias' || doc.id === 'config') return;
                        if (!data.id) data.id = doc.id;
                        if (!data.empleadoAsignado && data.empleadoId) {
                            data.empleadoAsignado = data.empleadoId;
                        }
                        lista.push(data);
                    });
                    causas = lista;
                    return causas;
                } catch (error) {
                    console.error('Error cargando datos:', error);
                    showToast('Error al cargar datos desde Firestore', 'danger');
                    causas = [];
                    return [];
                }
            }

            // ---------- SECRETARIO ----------
            function renderSecretario(container) {
                const totalSinAsignar = causas.filter(c => {
                    if (c.estado !== 'en_secretaria') return false;
                    return !esConsultaDeEmpleado(c);
                }).length;

                const enProceso = causas.filter(c => c.estado === 'en_proceso').length;
                const paraFinalizar = causas.filter(c => {
                    if (c.estado !== 'en_secretaria') return false;
                    return esConsultaDeEmpleado(c);
                }).length;
                const enDefensor = causas.filter(c => c.estado === 'en_defensor').length;
                const finalizados = causas.filter(c => c.estado === 'finalizada').length;

                let mejorCumplimiento = { id: null, nombre: 'N/A', count: -1 };
                let mayorCarga = { id: null, nombre: 'N/A', count: -1 };
                let mayorDemora = { id: null, nombre: 'N/A', dias: -1 };

                CONFIG.empleados.forEach(emp => {
                    const finalizadasEmp = causas.filter(c => c.estado === 'finalizada' && (c.empleadoAsignado ===
                        emp.id || c.empleadoOriginal === emp.id)).length;
                    if (finalizadasEmp > mejorCumplimiento.count) {
                        mejorCumplimiento = { id: emp.id, nombre: emp.nombre, count: finalizadasEmp };
                    }
                    const totalEmp = causas.filter(c => c.empleadoAsignado === emp.id || c.empleadoOriginal === emp.id)
                        .length;
                    if (totalEmp > mayorCarga.count) {
                        mayorCarga = { id: emp.id, nombre: emp.nombre, count: totalEmp };
                    }
                    const dias = calcularDiasRetraso(emp.id);
                    if (dias > mayorDemora.dias) {
                        mayorDemora = { id: emp.id, nombre: emp.nombre, dias };
                    }
                });

                const empCarga = CONFIG.empleados.map(emp => {
                    const total = causas.filter(c => c.empleadoAsignado === emp.id || c.empleadoOriginal === emp.id)
                        .length;
                    return { nombre: emp.nombre, total };

                            <div class="dest-detalle">${mayorCarga.count} expedientes en total</div>

                                    label: 'Carga histórica',
                                    data: empCarga.map(e => e.total),
                                    backgroundColor: empCarga.map(e => e.total >= 20 ?
                                        '#c62828' : e.total > 15 ? '#e67e22' :
                                        '#1976d2'),
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,

                                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                            }

                    }

            // ---------- FUNCIONES DE PAGINACIÓN ----------
            function paginateData(data, page, perPage = 10) {
                const total = data.length;
                const totalPages = Math.ceil(total / perPage) || 1;
                const start = (page - 1) * perPage;
                const end = Math.min(start + perPage, total);
                return { items: data.slice(start, end), total, totalPages, page, start, end };
            }

            function renderPagination(targetId, total, totalPages, page, perPage, callback) {
                const container = document.getElementById(targetId);
                if (!container) return;
                let html = `<div class="pagination-bar">
                    <div class="info">Mostrando ${total ? Math.min((page-1)*perPage + 1, total) : 0} - ${Math.min(page*perPage, total)} de ${total}</div>
                    <div>
                        <button class="page-btn" data-page="prev" ${page<=1?'disabled':''}>Anterior</button>
                        ${Array.from({length: Math.min(totalPages, 10)}, (_, i) => {
                            let p = i + 1;
                            if (totalPages > 10) { if (p < page - 4 || p > page + 4) { if (p === 1 || p === totalPages) return `<button class="page-btn" data-page="${p}">${p}</button>`; if (p === page - 5 || p === page + 5) return `<span>…</span>`; return ''; } }
                            return `<button class="page-btn ${p===page?'active':''}" data-page="${p}">${p}</button>`;
                        }).join('')}
                        <button class="page-btn" data-page="next" ${page>=totalPages?'disabled':''}>Siguiente</button>
                    </div>
                    <div class="page-selector">
                        <label>Ver:</label>
                        <select class="form-select form-select-sm" style="width:70px;" id="perPageSelect">
                            <option value="5" ${perPage===5?'selected':''}>5</option>
                            <option value="10" ${perPage===10?'selected':''}>10</option>
                            <option value="25" ${perPage===25?'selected':''}>25</option>
                            <option value="50" ${perPage===50?'selected':''}>50</option>
                        </select>
                    </div>
                </div>`;
                container.innerHTML = html;
                container.querySelectorAll('.page-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const p = this.dataset.page;
                        let newPage = page;
                        if (p === 'prev') newPage = Math.max(1, page - 1);
                        else if (p === 'next') newPage = Math.min(totalPages, page + 1);
                        else newPage = parseInt(p);
                        if (newPage !== page) callback(newPage, perPage);
                    });
                });
                const perPageSelect = document.getElementById('perPageSelect');
                if (perPageSelect) { perPageSelect.addEventListener('change', function(e) { callback(1, parseInt(this.value)); }); }
            }

            // ---------- EMPLEADO (CON TABLA FILTRADA, PAGINADA Y KPI DE TOTAL) ----------
            function renderEmpleado(container) {
                // Obtener todos los expedientes asignados a empleados
                let filas = [];
                CONFIG.empleados.forEach(emp => {
                    const causasEmp = causas.filter(c => {
                        const esSuPase = (
                            (c.empleadoId && (c.empleadoId === emp.id || c.empleadoId === emp.nombre)) ||
                            (c.empleadoAsignado && (c.empleadoAsignado === emp.id || c.empleadoAsignado === emp
                                .nombre)) ||
                            (c.empleadoOriginal && c.empleadoOriginal === emp.id)
                        );
                        return esSuPase;
                    });
                    causasEmp.forEach(c => {
                        let tieneDemora = false;
                        if (c.estado === 'en_proceso' && c.empleadoAsignado === emp.id && c.fechaLimite) {
                            if (new Date(c.fechaLimite) < new Date()) {
                                tieneDemora = true;
                            }
                        }
                        filas.push({
                            empleado: emp.nombre,
                            empleadoId: emp.id,
                            expediente: c.numero || c.expediente || c.id, // priorizar numero
                            tipo: c.tipo || c.motivo || c.tipoPase || 'Pase',
                            secretario: getSecName(c.secretarioId) || '-',
                            secretarioId: c.secretarioId || 'sin',
                            estado: c.estado || 'Sin estado',
                            tieneDemora: tieneDemora,
                            id: c.id
                        });
                    });
                });

                // Obtener valores únicos para filtros
                const tiposUnicos = [...new Set(filas.map(f => f.tipo))].sort();
                const estadosUnicos = [...new Set(filas.map(f => f.estado))].sort();
                const secretariosUnicos = [...new Set(filas.map(f => f.secretario))].filter(s => s !== '-');

                // Aplicar filtros
                let filtrados = filas;
                if (filtrosEmpleado.empleado !== 'todos') {
                    filtrados = filtrados.filter(f => f.empleadoId === filtrosEmpleado.empleado);
                }
                if (filtrosEmpleado.tipo !== 'todos') {
                    filtrados = filtrados.filter(f => f.tipo === filtrosEmpleado.tipo);
                }
                if (filtrosEmpleado.secretario !== 'todos') {
                    filtrados = filtrados.filter(f => f.secretario === filtrosEmpleado.secretario);
                }
                if (filtrosEmpleado.estado !== 'todos') {
                    filtrados = filtrados.filter(f => f.estado === filtrosEmpleado.estado);
                }

                // Paginación
                const pState = paginacionEmpleado;
                const { items, total, totalPages, page } = paginateData(filtrados, pState.page, pState.perPage);

                // --- Construir texto de filtro activo ---
                let filtroActivoTexto = 'Todos';
                const partes = [];
                if (filtrosEmpleado.empleado !== 'todos') {
                    const emp = CONFIG.empleados.find(e => e.id === filtrosEmpleado.empleado);
                    if (emp) partes.push(`Empleado: ${emp.nombre}`);
                }
                if (filtrosEmpleado.tipo !== 'todos') {
                    partes.push(`Tipo: ${filtrosEmpleado.tipo}`);
                }
                if (filtrosEmpleado.secretario !== 'todos') {
                    partes.push(`Secretario: ${filtrosEmpleado.secretario}`);
                }
                if (filtrosEmpleado.estado !== 'todos') {
                    partes.push(`Estado: ${filtrosEmpleado.estado}`);
                }
                if (partes.length > 0) {
                    filtroActivoTexto = partes.join(' · ');
                }

                // Construir tabla
                let tablaHTML = '';
                if (items.length === 0) {
                    tablaHTML = `<p class="text-muted">No hay expedientes que coincidan con los filtros.</p>`;
                } else {
                    tablaHTML = `
                        <div class="table-wrapper">
                            <table class="table table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>Empleado</th>
                                        <th>Expediente Asignado</th>
                                        <th>Tipo</th>
                                        <th>Secretario</th>
                                        <th>Estado Actual</th>
                                        <th>Tiene demora</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    items.forEach(f => {
                        const demoraHTML = f.tieneDemora ?

                            `<span class="demora-no">No</span>`;

                            <tr>
                                <td>${f.empleado}</td>
                                <td><a href="#" class="expediente-link">${f.expediente}</a></td>
                                <td><span class="tipo-negrita-azul">${f.tipo}</span></td>
                                <td>${f.secretario}</td>
                                <td>${f.estado}</td>
                                <td>${demoraHTML}</td>
                            </tr>
                        `;
                    });
                    tablaHTML += `</tbody></table></div>`;
                }

                // --- Construir el resto del módulo (selector, gráfico y KPIs) ---
                // Sincronizar empleadoSeleccionado con el filtro de empleado de la tabla
                let empId = empleadoSeleccionado;
                if (filtrosEmpleado.empleado !== 'todos') {
