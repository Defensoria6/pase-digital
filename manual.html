<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Manual de Uso del Sistema Digital de Pase de Causas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* Estilos existentes (no modificados) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #eef2f9 0%, #d9e2ef 100%);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            padding: 1.5rem 2rem 1rem 2rem;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(25, 118, 210, 0.15);
            margin-bottom: 1.2rem;
            flex-shrink: 0;
            position: relative;
        }

        .header-left h1 {
            font-weight: 700;
            font-size: 1.8rem;
            color: #0a2a44;
            margin: 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-left h1 i {
            color: #1976d2;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            position: relative;
        }

        .btn-back {
            background: rgba(25, 118, 210, 0.08);
            border: 1px solid #d0e0f0;
            color: #0a2a44;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            min-height: 44px;
        }
        .btn-back:hover {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2;
        }

        .btn-print {
            background: rgba(25, 118, 210, 0.08);
            border: 1px solid #d0e0f0;
            color: #0a2a44;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            min-height: 44px;
        }
        .btn-print:hover {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2;
        }

        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(25, 118, 210, 0.08);
        }

        /* --- GRID VIEW --- */
        .grid-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2rem;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            overflow-y: auto;
        }
        .grid-view.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            position: absolute;
            width: 100%;
        }

        .launcher-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.2rem;
            max-width: 1100px;
            width: 100%;
        }

        .module-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 3rem 2rem;
            text-align: center;
            text-decoration: none;
            color: #0a2a44;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(25, 118, 210, 0.10);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 260px;
            cursor: pointer;
        }
        .module-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.02);
            border-color: #1976d2;
            background: #f9fcff;
        }
        .module-card i {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }
        .module-card:hover i {
            transform: scale(1.05);
        }
        .module-card .card-title {
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
            color: #0a2a44;
        }
        .module-card .card-sub {
            font-size: 0.95rem;
            color: #5f7f9f;
            font-weight: 400;
        }

        .module-card.operador i {
            color: #1976d2;
        }
        .module-card.secretario i {
            color: #e67e22;
        }
        .module-card.empleados i {
            color: #2e7d32;
        }
        .module-card.defensor i {
            color: #7b1fa2;
        }

        .module-card.operador {
            border-left: 4px solid #1976d2;
        }
        .module-card.secretario {
            border-left: 4px solid #e67e22;
        }
        .module-card.empleados {
            border-left: 4px solid #2e7d32;
        }
        .module-card.defensor {
            border-left: 4px solid #7b1fa2;
        }

        /* --- CONTENT VIEW --- */
        .content-view {
            display: none;
            height: 100%;
            width: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
            overflow-y: auto;
            padding: 2.5rem;
            color: #0a2a44;
        }
        .content-view.active {
            display: block;
            opacity: 1;
        }
        .content-view h2 {
            color: #1976d2;
            font-weight: 700;
            margin-bottom: 1rem;
            border-bottom: 2px solid #eef2f9;
            padding-bottom: 0.5rem;
        }
        .content-view h3 {
            color: #0a2a44;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        .content-view h4 {
            color: #0a2a44;
            font-weight: 600;
            margin-top: 1.2rem;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }
        .content-view p {
            line-height: 1.7;
            margin-bottom: 1rem;
            color: #334e68;
        }
        .content-view ul {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .content-view li {
            line-height: 1.6;
            margin-bottom: 0.8rem;
            color: #334e68;
        }
        .content-view strong {
            color: #0a2a44;
        }
        .content-view .badge-module {
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .app-footer {
            flex-shrink: 0;
            text-align: center;
            font-size: 0.75rem;
            color: #8aa3bc;
            padding-top: 0.8rem;
            margin-top: 0.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* --- BOTÓN FLOTANTE ADMINISTRADOR (color naranja) --- */
        .btn-admin-fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1060;
            background: #e67e22; /* naranja */
            color: #fff;
            border: none;
            border-radius: 60px;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 24px rgba(230, 126, 34, 0.35);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        .btn-admin-fab:hover {
            background: #d35400;
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(230, 126, 34, 0.45);
        }
        .btn-admin-fab i {
            font-size: 1.6rem;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .app-container {
                padding: 1rem 1.2rem 0.8rem 1.2rem;
            }
            .launcher-grid {
                gap: 1.4rem;
                max-width: 600px;
            }
            .module-card {
                min-height: 200px;
                padding: 2rem 1.5rem;
            }
            .content-view {
                padding: 1.5rem;
            }
            .btn-admin-fab {
                bottom: 1.2rem;
                right: 1.2rem;
                padding: 12px 20px;
                font-size: 0.9rem;
            }
            .btn-admin-fab i {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 576px) {
            .app-container {
                padding: 0.6rem 0.6rem 0.4rem 0.6rem;
            }
            .launcher-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 0.4rem 0.4rem 0.2rem 0.4rem;
            }
            .app-header {
                gap: 0.5rem;
                margin-bottom: 0.8rem;
                padding-bottom: 0.3rem;
            }
            .header-left h1 {
                font-size: 1.4rem;
            }
            .btn-back,
            .btn-print {
                font-size: 0.75rem;
                padding: 6px 14px;
                min-height: 40px;
                gap: 4px;
            }
            .grid-view {
                padding: 0.5rem;
            }
            .launcher-grid {
                gap: 0.8rem;
            }
            .module-card {
                min-height: 150px;
                padding: 1.2rem 0.8rem;
                border-radius: 24px;
            }
            .module-card i {
                font-size: 2.8rem;
                margin-bottom: 0.5rem;
            }
            .module-card .card-title {
                font-size: 1.2rem;
                margin-bottom: 0.1rem;
            }
            .module-card .card-sub {
                font-size: 0.75rem;
            }
            .content-view {
                padding: 1rem;
            }
            .content-view h2 {
                font-size: 1.3rem;
                margin-bottom: 0.6rem;
                padding-bottom: 0.3rem;
            }
            .content-view h3 {
                font-size: 1.1rem;
                margin-top: 1rem;
                margin-bottom: 0.6rem;
            }
            .content-view p,
            .content-view li {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-view ul {
                margin-left: 1rem;
                margin-bottom: 1rem;
            }
            .app-footer {
                font-size: 0.6rem;
                padding-top: 0.4rem;
                margin-top: 0.2rem;
            }
            .btn-admin-fab {
                bottom: 0.8rem;
                right: 0.8rem;
                padding: 10px 16px;
                font-size: 0.8rem;
                border-radius: 40px;
            }
            .btn-admin-fab i {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 800px) and (orientation: landscape) {
            .app-container {
                padding: 0.6rem 1rem 0.4rem 1rem;
            }
            .launcher-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .module-card {
                min-height: 140px;
                padding: 1rem 0.8rem;
            }
            .module-card i {
                font-size: 2.5rem;
                margin-bottom: 0.3rem;
            }
            .module-card .card-title {
                font-size: 1rem;
            }
            .content-view {
                padding: 1rem 1.2rem;
            }
        }

        @media (max-width: 360px) {
            .header-left h1 {
                font-size: 1.2rem;
            }
            .btn-back,
            .btn-print {
                font-size: 0.65rem;
                padding: 4px 10px;
                min-height: 34px;
            }
            .module-card i {
                font-size: 2.2rem;
            }
            .module-card .card-title {
                font-size: 1rem;
            }
            .module-card {
                min-height: 120px;
                padding: 0.8rem 0.5rem;
                border-radius: 20px;
            }
            .content-view h2 {
                font-size: 1.1rem;
            }
            .content-view h3 {
                font-size: 1rem;
            }
            .content-view p,
            .content-view li {
                font-size: 0.8rem;
            }
            .btn-admin-fab {
                padding: 8px 12px;
                font-size: 0.7rem;
                bottom: 0.5rem;
                right: 0.5rem;
            }
            .btn-admin-fab i {
                font-size: 1rem;
            }
        }

        /* --- MODAL DE IMPRESIÓN --- */
        .print-modal-body {
            padding: 2rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .print-modal-body h2 {
            color: #1976d2;
            font-weight: 700;
            margin-bottom: 1rem;
            border-bottom: 2px solid #eef2f9;
            padding-bottom: 0.5rem;
        }
        .print-modal-body h3 {
            color: #0a2a44;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        .print-modal-body h4 {
            color: #0a2a44;
            font-weight: 600;
            margin-top: 1.2rem;
            margin-bottom: 0.8rem;
        }
        .print-modal-body p {
            margin-bottom: 1rem;
            color: #334e68;
        }
        .print-modal-body ul {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .print-modal-body li {
            margin-bottom: 0.8rem;
            color: #334e68;
        }
        .print-modal-body strong {
            color: #0a2a44;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .modal,
            .modal * {
                visibility: visible;
            }
            .modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: block !important;
                background: white;
                margin: 0;
                padding: 0;
                overflow: visible;
            }
            .modal-dialog {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .modal-content {
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                min-height: 100vh;
            }
            .modal-header,
            .modal-footer {
                display: none !important;
            }
            .modal-body {
                padding: 20mm !important;
                font-size: 11pt;
                line-height: 1.5;
            }
            .print-modal-body h2 {
                font-size: 18pt;
            }
            .print-modal-body h3 {
                font-size: 14pt;
            }
            .print-modal-body p,
            .print-modal-body li {
                font-size: 11pt;
            }
            .modal-body * {
                visibility: visible !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <div class="header-left">
                <h1>
                    <i class="bi bi-book"></i> Manual de Uso
                </h1>
            </div>

            <div class="header-right">
                <button class="btn-print" id="btnImprimir">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-back" id="btnVolver">
                    <i class="bi bi-arrow-left"></i> Volver a los Módulos
                </button>
            </div>
        </header>

        <div class="main-content">

            <!-- Vista de Cuadrícula (Menú Principal) -->
            <div class="grid-view" id="gridView">
                <div class="launcher-grid">

                    <div class="module-card operador" data-module="operador">
                        <i class="bi bi-inbox"></i>
                        <div class="card-title">Operador</div>
                    </div>

                    <div class="module-card secretario" data-module="secretario">
                        <i class="bi bi-share"></i>
                        <div class="card-title">Secretario</div>
                    </div>

                    <div class="module-card empleados" data-module="empleado">
                        <i class="bi bi-person-check"></i>
                        <div class="card-title">Empleados</div>
                    </div>

                    <div class="module-card defensor" data-module="defensor">
                        <i class="bi bi-shield-check"></i>
                        <div class="card-title">Defensor</div>
                    </div>

                </div>
            </div>

            <!-- Vista de Contenido del Manual -->
            <div class="content-view" id="contentView">
                <div id="moduleContent"></div>
            </div>

        </div>

        <footer class="app-footer">
            <i class="bi bi-database"></i> Sistema Unificado · <span id="fechaActual"></span>
        </footer>

    </div>

    <!-- Botón flotante Administrador (color naranja) -->
    <button class="btn-admin-fab" id="btnAdminFab" title="Manual del Administrador">
        <i class="bi bi-person-gear"></i> Administrador
    </button>

    <!-- Modal de impresión -->
    <div class="modal fade" id="printModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg" style="max-width: 210mm;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="printModalLabel">Imprimir Manual</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body print-modal-body" id="printModalBody">
                    <!-- El contenido se inyecta aquí -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btnPrintAction">Imprimir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y lógica -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        (function() {
            // ============================================================
            //  CONTENIDO COMPLETO DEL MANUAL (sin emojis en títulos, excepto Administrador)
            // ============================================================
            const manualData = {
                operador: `
                    <h2>Operador (Mesa de Entradas / Ingreso)</h2>
                    <p><strong>Función:</strong> Es el encargado de ingresar las causas al sistema. Su labor se centra exclusivamente en el pase de los expedientes a los Secretarios de la Defensoría. <span class="badge-module">Restricción</span> No está facultado para distribuir expedientes directamente a los Empleados.</p>
                    <p><strong>Dependencia:</strong> Los Operadores asisten y deben responder directamente a los Secretarios.</p>

                    <h3>1. Inicio de Sesión</h3>
                    <ul>
                        <li>En la pantalla de inicio, despliegue la lista <strong>“Seleccione un operador…”</strong> y elija su nombre.</li>
                        <li>Ingrese su <strong>contraseña</strong> en el campo de texto.</li>
                        <li>Haga clic en el botón <strong>Ingresar</strong>. Si se equivoca, el sistema mostrará un mensaje de error.</li>
                    </ul>

                    <h3>2. Registro de un Nuevo Expediente</h3>
                    <p>Complete el formulario <strong>“Nueva Causa”</strong> con los siguientes datos obligatorios:</p>
                    <ul>
                        <li><strong>N° Expediente:</strong> Número identificatorio de la causa.</li>
                        <li><strong>Tipo:</strong> Seleccione el tipo de trámite (ej. Divorcio, Alimentos, Amparo, Cámara Gesell, etc.).</li>
                        <li><strong>Complejidad:</strong> Nivel del 1 al 4 (por defecto Nivel 2).</li>
                        <li><strong>Fuente:</strong> Marque si el expediente proviene de SIGED y/o ZIMBRA.</li>
                    </ul>
                    <h4>Acción previa a la asignación</h4>
                    <p>Antes de confirmar, debe decidir el destino del expediente. El sistema ofrece 4 opciones:</p>
                    <ul>
                        <li><strong>Asignar a Secretaría</strong> (por defecto): El sistema asigna automáticamente al secretario con menor carga (y que no esté ausente). Si es de tipo “Cámara Gesell”, se deriva directamente al Defensor.</li>
                        <li><strong>Devolución a SIGED</strong>: Rechazo por error de origen. Requiere ingresar un <em>Motivo</em>.</li>
                        <li><strong>Remisión a otra dependencia</strong>: Envío a otro juzgado o área. Requiere <em>Dependencia</em> y <em>Motivo</em>.</li>
                        <li><strong>Rechazo</strong>: La causa no se tramita. Requiere <em>Motivo</em> obligatorio.</li>
                    </ul>
                    <p>Agregue <strong>Observaciones</strong> si es necesario y haga clic en <strong>Registrar</strong>. El sistema mostrará un mensaje de confirmación.</p>

                    <h3>3. Gestión de Ausencias de Secretarios</h3>
                    <p>Debajo del formulario se encuentra el botón <strong>“Gestionar ausencias”</strong>. Aquí el Operador puede registrar si un secretario faltará (fecha de inicio y fin). Esto evita que el sistema le asigne causas nuevas automáticamente a un secretario ausente.</p>

                    <h3>4. Visualización y Seguimiento (Tabla de Recientes)</h3>
                    <ul>
                        <li><strong>Búsqueda rápida:</strong> En la barra superior (lupa) para encontrar expedientes por número.</li>
                        <li><strong>Filtros:</strong> Puede filtrar por <em>Mes</em> y <em>Año</em> para ver registros históricos. Use el botón <strong>“Limpiar”</strong> para restablecer la vista.</li>
                        <li><strong>Paginación:</strong> Elija cuántos expedientes ver por página (5, 10, 25 o 50).</li>
                    </ul>

                    <h3>5. Acciones Posteriores sobre Causas en Trámite</h3>
                    <p>Si una causa ya está en estado <em>“Secretaría”</em> o <em>“En proceso”</em>, puede aplicar acciones rápidas con los botones al final de cada fila:</p>
                    <ul>
                        <li><strong>Devolver a SIGED:</strong> Cambia el estado a “devuelto”. Debe escribir el motivo.</li>
                        <li><strong>Remitir a otra dependencia:</strong> Cambia el estado a “remitido”. Debe escribir destino y motivo.</li>
                        <li><strong>Rechazar:</strong> Cambia el estado a “rechazado”. Debe escribir el motivo.</li>
                        <li><strong>Ver Historial:</strong> Muestra la línea de tiempo completa del expediente (quién, cuándo y comentario).</li>
                    </ul>

                    <h3>6. Reportes y Cierre de Sesión</h3>
                    <ul>
                        <li><strong>Reporte de Actividad:</strong> Botón <strong>“Reporte”</strong> genera un resumen imprimible de los expedientes visibles (respeta filtros). Una vez abierto, puede imprimirlo.</li>
                        <li><strong>Cerrar Sesión:</strong> Botón <strong>“Salir”</strong> (arriba a la derecha). El sistema pide confirmación antes de volver a la pantalla de inicio.</li>
                    </ul>
                `,

                secretario: `
                    <h2>Secretario (Distribución)</h2>
                    <p><strong>Función:</strong> Son los únicos autorizados para distribuir los expedientes a los Empleados (junto con el Defensor). Reciben el trabajo del Operador, evalúan la complejidad y lo asignan al personal.</p>

                    <h3>Paso 1: Acceso al Sistema</h3>
                    <p>Ingrese a la plataforma con su <strong>contraseña de acceso</strong>. Una vez validada, el sistema carga el panel principal con todos los expedientes y estadísticas.</p>

                    <h3>Paso 2: Revisión de Bandeja de Entrada</h3>
                    <p>En el panel principal se encuentra la sección <strong>“Pendientes en Secretaría”</strong>. Aquí ingresan las nuevas causas que requieren asignación.</p>
                    <ul>
                        <li>Visualice el número de expediente, tipo y nivel de complejidad.</li>
                        <li>Utilice la barra de búsqueda superior para encontrar un expediente específico.</li>
                    </ul>

                    <h3>Paso 3: Distribución y Asignación de Causas</h3>
                    <p>El Secretario debe derivar los expedientes pendientes a los empleados. El sistema ofrece tres modalidades:</p>
                    <ul>
                        <li><strong>Asignación Manual:</strong> Elija el nivel de la causa, seleccione un empleado del listado, añada una observación y haga clic en <strong>“Asignar”</strong>.</li>
                        <li><strong>Asignación Automática Individual:</strong> Al presionar el botón <strong>“Auto”</strong>, el sistema selecciona inteligentemente al empleado menos cargado en ese momento.</li>
                        <li><strong>Distribución Masiva:</strong> Con el botón <strong>“Distribuir automático”</strong>, el sistema asigna de golpe todas las causas pendientes de la bandeja de forma equitativa.</li>
                    </ul>

                    <h3>Paso 4: Seguimiento (Causas en Proceso)</h3>
                    <p>Una vez asignadas, las causas pasan a la sección <strong>“Causas en Proceso”</strong>. Aquí el Secretario monitorea el progreso del equipo:</p>
                    <ul>
                        <li><strong>Control de tiempos:</strong> El sistema muestra un cronómetro con la demora de cada trámite. Si un empleado se atrasa, su carga aparecerá en color rojo.</li>
                        <li><strong>Consultas:</strong> Puede revisar las dudas que el empleado haya dejado usando el botón <strong>“Consultas”</strong> o ver el historial completo del expediente.</li>
                    </ul>

                    <h3>Paso 5: Resolución y Finalización</h3>
                    <p>Cuando el empleado termina su labor, el Secretario debe revisar y dar cierre al proceso. Existen dos caminos principales:</p>
                    <ul>
                        <li><strong>Cumplido:</strong> Si la tarea se realizó correctamente, presione el botón <strong>“Cumplido”</strong> para autorizar la finalización del expediente.</li>
                        <li><strong>Elevar a Defensor:</strong> Si el expediente requiere intervención superior, presione <strong>“Elevar a Defensor”</strong> e ingrese el motivo de la remisión.</li>
                    </ul>

                    <h3>Paso 6: Gestión de Personal y Reportes</h3>
                    <ul>
                        <li><strong>Gestión de Ausencias:</strong> En la tabla de equidad, marque a un empleado como <strong>“Ausente”</strong> para que el sistema deje de asignarle causas, y <strong>“Reintegro”</strong> cuando regrese.</li>
                        <li><strong>Reportes:</strong> Genere un <strong>Reporte General</strong> mensual o imprima el <strong>Informe de Equidad</strong> para auditar cuántos expedientes ha resuelto cada empleado y secretario.</li>
                    </ul>
                `,

                empleado: `
                    <h2>Empleado (Módulo de Trabajo)</h2>
                    <p><strong>Función:</strong> Encargado de la tramitación de las causas. Cada empleado tiene en su bandeja la información exacta de qué Secretario le asignó el expediente, y debe reportar los avances exclusivamente a ese Secretario.</p>

                    <h3>1. Inicio de Sesión</h3>
                    <ul>
                        <li>Seleccione su <strong>usuario</strong> en el menú desplegable de la pantalla principal.</li>
                        <li>Ingrese su <strong>contraseña</strong> personal.</li>
                        <li>Haga clic en el botón azul <strong>“Ingresar”</strong> (o presione Enter) para acceder a su bandeja de tareas.</li>
                    </ul>

                    <h3>2. Bandeja de Tareas (Mis Tareas)</h3>
                    <p>Una vez dentro, visualizará el panel <strong>“Mis Tareas”</strong> con todos los expedientes asignados y en proceso.</p>
                    <h4>Búsqueda y Filtros</h4>
                    <ul>
                        <li><strong>Búsqueda global:</strong> En la barra superior, escriba el número del expediente para encontrarlo rápidamente.</li>
                        <li><strong>Filtros por Fecha:</strong> Seleccione un <em>Mes</em> y <em>Año</em> específico de asignación. Use el botón <strong>“Limpiar”</strong> para restablecer la vista.</li>
                    </ul>
                    <h4>Información del Expediente</h4>
                    <ul>
                        <li><strong>Expediente y Tipo:</strong> Identificación clara de la causa.</li>
                        <li><strong>Asignación y Tiempo:</strong> Muestra la fecha exacta de asignación y un cronómetro dinámico (días, horas, minutos).</li>
                        <li><strong>Nivel:</strong> Nivel de prioridad asignado por el secretario.</li>
                        <li><strong>Observación:</strong> Lea atentamente esta columna; contiene el comentario o instrucción directa del Secretario.</li>
                    </ul>

                    <h3>3. Gestión y Finalización de Tareas</h3>
                    <p>Para cada tarea en proceso, encontrará botones de acción específicos:</p>
                    <ul>
                        <li><strong>Devolver:</strong> Cuando la tarea ha sido cumplida y el expediente debe regresar al Secretario que lo asignó. <em>Requisito:</em> ingresar un motivo (ej. “Tarea cumplida”, “Cédula enviada”).</li>
                        <li><strong>Enviar a Secretario:</strong> Cuando surge una duda o necesita consultar al Secretario antes de avanzar. <em>Requisito:</em> redactar la consulta o motivo.</li>
                        <li><strong>Ver Historial:</strong> Para revisar todos los movimientos, fechas y comentarios previos de ese expediente.</li>
                    </ul>

                    <h3>4. Reportes y Actualización</h3>
                    <ul>
                        <li><strong>Estadísticas Personales:</strong> En la parte superior derecha, botón <strong>“Imprimir reporte”</strong> genera un documento listo para imprimir con el listado de todos sus expedientes (en proceso y finalizados), calculando tiempos de resolución. El botón <strong>“Estadísticas”</strong> muestra un resumen de tareas cumplidas desglosadas por nivel de prioridad, tiempo promedio y qué secretarios le han asignado tareas.</li>
                        <li><strong>Sincronización:</strong> El sistema se actualiza automáticamente cada 5 minutos. Si requiere ver cambios inmediatos, presione el botón <strong>“Actualizar BD”</strong> en la barra superior.</li>
                    </ul>

                    <h3>5. Cierre de Sesión</h3>
                    <ul>
                        <li>Haga clic en el botón <strong>“Salir”</strong> (arriba a la derecha).</li>
                        <li>El sistema mostrará una alerta de confirmación. Seleccione <strong>“Sí, salir”</strong> para volver a la pantalla de inicio sin perder ningún dato de su progreso.</li>
                    </ul>
                `,

                defensor: `
                    <h2>Defensor Oficial (Auditoría y Evaluación)</h2>
                    <p><strong>Función:</strong> Es la autoridad máxima y el auditor final del sistema. Supervisa el flujo completo, evalúa el rendimiento general y califica el trabajo de toda la dependencia.</p>

                    <h3>1. Acceso e Inicio de Sesión</h3>
                    <p>El Defensor ingresa con su <strong>credencial de seguridad</strong>. El sistema reconoce el perfil y habilita automáticamente la etiqueta de <em>Defensor (Full)</em>, desbloqueando privilegios máximos para visualizar módulos de operadores, secretarios y control general.</p>

                    <h3>2. Recepción y Monitoreo de Causas</h3>
                    <p>Los expedientes que requieren análisis, decisión o firma definitiva llegan al Defensor por dos vías:</p>
                    <ul>
                        <li><strong>Elevación por Secretaría:</strong> Causas ya tramitadas por los empleados que el Secretario eleva, asignándoles el estado <em>“Defensor”</em>.</li>
                        <li><strong>Ingreso Directo:</strong> Casos críticos o especiales, como los expedientes de <strong>Cámara Gesell</strong>, se derivan automáticamente al Defensor al momento de su registro inicial.</li>
                    </ul>

                    <h3>3. Gestión Específica de Cámara Gesell</h3>
                    <p>El Defensor asume un rol protagónico en los expedientes de índole penal o protección de personas. Para estos casos, el sistema cuenta con un flujo dedicado donde el Defensor debe:</p>
                    <ul>
                        <li>Auditar las fechas y horarios de las audiencias programadas.</li>
                        <li>Registrar formalmente el cumplimiento de la medida, actualizando el estado de asistencia a <strong>“Asistió”</strong>, <strong>“No asistió”</strong> o <strong>“Pendiente”</strong>.</li>
                    </ul>

                    <h3>4. Intervención, Resoluciones y Acciones Directas</h3>
                    <p>Desde su panel, el Defensor puede determinar el destino final de cualquier expediente. Las acciones incluyen:</p>
                    <ul>
                        <li><strong>Aprobación/Cumplimiento:</strong> Dar el visto bueno a causas ya gestionadas por el equipo.</li>
                        <li><strong>Devolución a SIGED:</strong> Ordenar la restitución del expediente al sistema general por errores formales o falta de competencia.</li>
                        <li><strong>Remisión:</strong> Trasladar formalmente la causa a una dependencia externa específica (ej. otro Juzgado).</li>
                        <li><strong>Rechazo Fundado:</strong> Detener el avance del pase, exigiendo la carga obligatoria del motivo.</li>
                    </ul>
                    <p><strong>Trazabilidad:</strong> Cada resolución inscribe automáticamente un registro inalterable en el <em>Historial</em> de la causa, con fecha, acción, comentario y firma electrónica del Defensor.</p>

                    <h3>5. Auditoría y Control de Gestión (Cierre de Tareas)</h3>
                    <ul>
                        <li><strong>Auditoría de Rendimiento (Ranking):</strong> Revisión del puntaje de desempeño (1 al 10) de los empleados, controlando quién posee causas vencidas (morosidad) o sobrecarga.</li>
                        <li><strong>Informe de Equidad:</strong> Generación de reportes para verificar que el algoritmo de distribución haya repartido justamente las causas según los niveles de complejidad (N1 a N4) entre el personal disponible y los secretarios.</li>
                        <li><strong>Reporte de Gesell:</strong> Emisión de estadísticas sobre la proporción de audiencias asistidas contra el volumen total de ingresos bajo esta modalidad.</li>
                    </ul>
                `,

                administrador: `
                    <h2>⚙️ Administrador del Sistema</h2>
                    <p><strong>Función:</strong> El Administrador tiene control total sobre la configuración, gestión de usuarios, supervisión de todo el flujo y generación de reportes globales. Este manual detalla paso a paso sus tareas.</p>

                    <h3>Fase 1: Ingreso y Configuración Inicial</h3>
                    <h4>Paso 1: Inicio de Sesión</h4>
                    <p>Al acceder al sistema, visualizará la pantalla de <strong>“Acceso Administrador”</strong>. Debe ingresar su <strong>contraseña de acceso</strong> (la contraseña configurada es <code>admin</code>) y hacer clic en <strong>“Ingresar”</strong>. Esto habilitará todas las pestañas de control y reportes de la plataforma.</p>

                    <h4>Paso 2: Gestión de Ausencias de Secretarios</h4>
                    <p>Antes de comenzar a derivar expedientes, es fundamental verificar la disponibilidad del personal:</p>
                    <ul>
                        <li>Haga clic en el botón <strong>“Gestionar ausencias”</strong> dentro de la pestaña de Ingreso.</li>
                        <li>Seleccione al secretario ausente, especifique la fecha de inicio y de fin, y haga clic en <strong>“Agregar”</strong>.</li>
                        <li>Esto es crítico porque el sistema realiza asignaciones automáticas y equitativas distribuyendo el trabajo únicamente entre los secretarios presentes.</li>
                    </ul>

                    <h3>Fase 2: Gestión de Expedientes (Ingreso y Distribución)</h3>
                    <h4>Paso 3: Registro de Nuevas Causas</h4>
                    <p>Desde el panel principal de ingreso, el Administrador es responsable de dar de alta los expedientes entrantes:</p>
                    <ul>
                        <li>Seleccione el <strong>Operador</strong> responsable de la carga y digite el <strong>N° de Expediente</strong>.</li>
                        <li>Elija el <strong>Tipo</strong> de causa (ej. Divorcio, Alimentos, Amparo, Cámara Gesell, etc.) y su nivel de <strong>Complejidad</strong> (1 al 4).</li>
                        <li>Marque las casillas de fuente de origen si corresponde (SIGED o ZIMBRA).</li>
                        <li>Agregue cualquier <strong>observación</strong> necesaria en el cuadro de texto provisto.</li>
                    </ul>

                    <h4>Paso 4: Determinación de la Acción Inmediata</h4>
                    <p>Antes de guardar la causa, el Administrador debe definir qué hacer con ella seleccionando una opción en <strong>“Acción previa a la asignación”</strong>:</p>
                    <ul>
                        <li><strong>Asignar a Secretaría</strong> (predeterminado): La causa ingresa al sistema y se deriva automáticamente a la Secretaría correspondiente para su proceso.</li>
                        <li><strong>Devolución a SIGED:</strong> La causa es rechazada y se devuelve al sistema de gestión original.</li>
                        <li><strong>Remisión a otra dependencia:</strong> Se envía el expediente a un destino externo (ej. Juzgado N° 3). Deberá detallar la dependencia y el motivo.</li>
                        <li><strong>Rechazo:</strong> La causa no procede; requiere justificar obligatoriamente el motivo del rechazo.</li>
                    </ul>

                    <h4>Paso 5: Distribución y Asignación de Tareas</h4>
                    <p>Para aquellos expedientes que continúan su curso interno, el Administrador tiene la facultad de asignar el trabajo a los empleados:</p>
                    <ul>
                        <li><strong>Asignación Manual:</strong> Puede elegir específicamente a qué empleado (Nadia, César, Raquel, etc.) derivar un caso particular.</li>
                        <li><strong>Asignación Automática:</strong> El sistema permite buscar al empleado <strong>“menos cargado”</strong>. Al utilizar esta opción, el sistema evalúa a los empleados sin causas atrasadas, la cantidad de puntos que tienen asignados y su nivel, para distribuir el trabajo de forma equitativa de manera inteligente.</li>
                    </ul>

                    <h3>Fase 3: Supervisión, Modificación y Auditoría</h3>
                    <h4>Paso 6: Supervisión y Cambio de Estados</h4>
                    <p>A lo largo de la jornada, el Administrador monitoriza el flujo de las causas en el sistema y puede intervenir modificando su estado:</p>
                    <ul>
                        <li><strong>Autorizar Cumplimiento:</strong> Puede marcar causas “en proceso” como <strong>“Finalizadas”</strong> si corrobora que la labor concluyó.</li>
                        <li><strong>Elevar al Defensor:</strong> Expedientes que requieren atención superior pueden ser elevados, adjuntando un motivo.</li>
                        <li><strong>Acciones correctivas:</strong> Puede utilizar atajos directos en la lista de recientes para <strong>Devolver a SIGED</strong>, <strong>Remitir</strong>, o <strong>Rechazar</strong> causas que estén en proceso.</li>
                    </ul>

                    <h4>Paso 7: Corrección y Eliminación</h4>
                    <p>En caso de que un expediente haya sido ingresado por error o contenga datos corruptos, el Administrador tiene el privilegio exclusivo de hacer clic en el botón de la papelera roja (<i class="bi bi-trash3"></i>) para <strong>Eliminar permanentemente</strong> la causa del sistema (esta acción requerirá confirmación).</p>

                    <h4>Paso 8: Generación de Reportes y Estadísticas</h4>
                    <p>Para medir el desempeño de la Defensoría, el Administrador puede generar e imprimir múltiples informes:</p>
                    <ul>
                        <li><strong>Reporte de Equidad:</strong> Visualiza la cantidad de causas asignadas a cada Secretario y la carga de niveles y puntos por Empleado.</li>
                        <li><strong>Ranking de Desempeño:</strong> Genera una tabla clasificatoria (de 0 a 10 puntos) de los empleados según la rapidez de resolución, indicando carga actual y estado de morosidad (atrasos).</li>
                        <li><strong>Reporte General y por Operador:</strong> Listados detallados de los últimos movimientos y expedientes finalizados en el día.</li>
                        <li><strong>Informe de Cámara Gesell:</strong> Métricas específicas sobre expedientes de tipo penal.</li>
                    </ul>

                    <h3>Fase 4: Finalización</h3>
                    <h4>Paso 9: Sincronización y Cierre</h4>
                    <p>Una vez concluida la gestión:</p>
                    <ul>
                        <li>El Administrador puede presionar el botón <strong>“Actualizar todas las BD”</strong> en la cabecera para forzar una sincronización y descargar el estado más reciente de la nube (Firestore).</li>
                        <li>Finalmente, utilizar el botón <strong>“Salir”</strong> para cerrar sesión de manera segura; los datos permanecerán respaldados automáticamente.</li>
                    </ul>
                `
            };

            // ============================================================
            //  LÓGICA DE NAVEGACIÓN
            // ============================================================
            const gridView = document.getElementById('gridView');
            const contentView = document.getElementById('contentView');
            const moduleContent = document.getElementById('moduleContent');
            const btnVolver = document.getElementById('btnVolver');
            const btnImprimir = document.getElementById('btnImprimir');
            const btnAdminFab = document.getElementById('btnAdminFab');

            // Modal de impresión
            const printModalEl = document.getElementById('printModal');
            const printModalBody = document.getElementById('printModalBody');
            const printModalLabel = document.getElementById('printModalLabel');
            const btnPrintAction = document.getElementById('btnPrintAction');

            let printModalInstance = null;
            let currentModuleName = '';

            function mostrarModulo(moduleKey) {
                if (manualData[moduleKey]) {
                    gridView.classList.add('hidden');
                    moduleContent.innerHTML = manualData[moduleKey];
                    contentView.classList.add('active');
                    contentView.style.display = 'block';
                    btnVolver.style.display = 'flex';
                    btnImprimir.style.display = 'flex';

                    // Obtener nombre del módulo para el título de impresión
                    if (moduleKey === 'administrador') {
                        currentModuleName = 'Administrador';
                    } else {
                        const card = document.querySelector(`.module-card[data-module="${moduleKey}"]`);
                        if (card) {
                            const titleEl = card.querySelector('.card-title');
                            currentModuleName = titleEl ? titleEl.textContent : moduleKey.charAt(0).toUpperCase() + moduleKey.slice(1);
                        } else {
                            currentModuleName = moduleKey.charAt(0).toUpperCase() + moduleKey.slice(1);
                        }
                    }
                }
            }

            function volverInicio() {
                contentView.classList.remove('active');
                contentView.style.display = 'none';
                gridView.classList.remove('hidden');
                btnVolver.style.display = 'none';
                btnImprimir.style.display = 'none';
                moduleContent.innerHTML = '';
                currentModuleName = '';
            }

            // Eventos de las tarjetas
            document.querySelectorAll('.module-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const moduleKey = this.dataset.module;
                    if (moduleKey) mostrarModulo(moduleKey);
                });
            });

            // Botón flotante Administrador
            btnAdminFab.addEventListener('click', function() {
                mostrarModulo('administrador');
            });

            btnVolver.addEventListener('click', volverInicio);

            // Botón Imprimir
            btnImprimir.addEventListener('click', function() {
                if (!moduleContent.innerHTML.trim()) return;

                printModalBody.innerHTML = moduleContent.innerHTML;
                printModalLabel.textContent = `Imprimir Manual - ${currentModuleName}`;

                if (!printModalInstance) {
                    printModalInstance = new bootstrap.Modal(printModalEl, {
                        backdrop: 'static',
                        keyboard: true
                    });
                }
                printModalInstance.show();
            });

            btnPrintAction.addEventListener('click', function() {
                window.print();
            });

            document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-AR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && btnVolver.style.display === 'flex') {
                    volverInicio();
                }
            });

        })();
    </script>

</body>
</html>
